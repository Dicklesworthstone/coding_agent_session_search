name: Persistent search service regressions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/search-service-regression.yml
      - src/main.rs
      - src/search_service.rs
      - src/search_service/**
      - src/search/**
      - tests/search_service.rs
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deadlines:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: nightly-2026-08-31
          components: clippy
      - name: Exercise the exact process supervisor without engine build latency
        run: |
          set -euo pipefail
          git rev-parse HEAD
          rustc --version
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'cass-deadline-tests'
          root.mkdir()
          source = Path('src/search_service/deadline.rs').resolve().as_posix()
          (root / 'Cargo.toml').write_text('[package]\nname="cass-deadline-tests"\nversion="0.0.0"\nedition="2024"\n[lib]\npath="lib.rs"\n')
          (root / 'lib.rs').write_text('#[allow(dead_code)]\n#[path = ' + json.dumps(source) + ']\nmod deadline;\n')
          PY
          manifest="$RUNNER_TEMP/cass-deadline-tests/Cargo.toml"
          cargo test --manifest-path "$manifest" -- --test-threads=1 --nocapture 2>&1 | tee deadline-tests.log
          grep -Eq 'test result: ok\. 5 passed; 0 failed; 2 ignored' deadline-tests.log
          cargo clippy --manifest-path "$manifest" --tests -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deadline-tests-${{ matrix.os }}-${{ github.sha }}
          path: deadline-tests.log
          if-no-files-found: warn
          retention-days: 7
  formatting:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          components: rustfmt
      - name: Check exact committed formatting
        run: rustfmt --edition 2024 --check --config skip_children=true src/search_service.rs src/search_service/*.rs tests/search_service.rs
      - name: Preserve formatter output for review without publishing it
        if: always()
        run: |
          git rev-parse HEAD > source-commit.txt
          rustfmt --version > formatter-version.txt
          rustfmt --edition 2024 --config skip_children=true src/search_service.rs src/search_service/*.rs tests/search_service.rs
          tar -czf search-service-formatted.tar.gz src/search_service.rs src/search_service tests/search_service.rs source-commit.txt formatter-version.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: search-service-formatted-${{ github.sha }}
          path: search-service-formatted.tar.gz
          if-no-files-found: error
          retention-days: 3
  native:
    concurrency:
      group: cass-search-service-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db
      - name: Record source and compiler
        run: git rev-parse HEAD && rustc --version && cargo --version
      - name: Real reader and binary regressions
        run: |
          set -o pipefail
          cargo test --locked --test search_service -- --test-threads=1 --nocapture 2>&1 | tee search-service-tests.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' search-service-tests.log
      - name: Format gate
        if: always()
        run: rustfmt --edition 2024 --check --config skip_children=true src/search_service.rs src/search_service/*.rs tests/search_service.rs
      - name: Clippy gate
        if: always()
        run: cargo clippy --locked --bin cass --test search_service -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: search-service-${{ github.sha }}
          path: search-service-tests.log
          if-no-files-found: warn
          retention-days: 7
