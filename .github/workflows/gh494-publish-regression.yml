name: Prepare reviewed query recovery

on:
  push:
    branches: [main]
    paths: ['.github/workflows/gh494-publish-regression.yml']

# Temporary native preparation of fixed, reviewed blobs, never a branch updater.
# The explicit source commit restores the read-only regression workflow.
permissions:
  contents: read

concurrency:
  group: gh494-query-recovery-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Dicklesworthstone/coding_agent_session_search' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RUST_MIN_STACK: '134217728'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          name = tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'name={name}', file=output)
          PY
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: ${{ steps.toolchain.outputs.name }}
          components: rustfmt, clippy
      - name: Apply only the reviewed patch and new modules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gh494-prepared"
          test "$(git hash-object src/lib.rs)" = 287d0d8f19eea08433a6585f10d3f8ca9a85fa59
          test "$(git hash-object src/indexer/mod.rs)" = f3796db5eb3b6a2a72222b9a7bc3a09ad283a752
          test "$(git hash-object src/indexer/gh494_tests.rs)" = c08b4b07139822729b18e390ba5b333611cbb08b
          test "$(git hash-object src/search/mod.rs)" = 44cf54f927ccf5ee6f77b8311ef8fae3d445dfe1
          test "$(git hash-object src/search/semantic_reader/publication/tests.rs)" = dba1c6bb918faa1d3d09845c6d2272ddc18364e6
          test "$(git hash-object tests/gh494_publish_resume.rs)" = fc1a4f4ea256a219b866011de74f6162360bce14
          test ! -e src/search/inline_repair.rs
          test ! -e src/search/gh494_repair_tests.rs
          fetch_blob() {
            gh api -H 'User-Agent: OpenAI File Downloader, XaiImageApiFetch/1.0' "repos/$GITHUB_REPOSITORY/git/blobs/$1" --jq .content | base64 --decode > "$2"
            test "$(git hash-object "$2")" = "$1"
          }
          fetch_blob 1a8c49864ff29f7e89bf0f879894cc9785559d88 "$RUNNER_TEMP/reviewed.patch"
          git apply --check --whitespace=error "$RUNNER_TEMP/reviewed.patch"
          git apply --whitespace=error "$RUNNER_TEMP/reviewed.patch"
          fetch_blob 6bf24b01a5cb56ac4001e19a78aaddc4d7f114ff src/search/inline_repair.rs
          fetch_blob 2cab528d984ac931d770e53c3d8d682334f18f26 src/search/gh494_repair_tests.rs
          rustfmt --edition 2024 --config skip_children=true src/search/inline_repair.rs src/search/gh494_repair_tests.rs src/indexer/gh494_tests.rs tests/gh494_publish_resume.rs
          rustfmt --edition 2024 --config skip_children=true --check src/search/inline_repair.rs src/search/gh494_repair_tests.rs src/indexer/gh494_tests.rs tests/gh494_publish_resume.rs
          rustfmt --edition 2024 --config skip_children=true --emit stdout src/lib.rs > "$RUNNER_TEMP/lib.parsed.rs"
          rustfmt --edition 2024 --config skip_children=true --emit stdout src/indexer/mod.rs > "$RUNNER_TEMP/indexer.parsed.rs"
          rustfmt --edition 2024 --config skip_children=true --emit stdout src/search/semantic_reader/publication/tests.rs > "$RUNNER_TEMP/semantic-tests.parsed.rs"
          git add -N src/search/inline_repair.rs src/search/gh494_repair_tests.rs
          git diff --check
          git diff --binary > "$RUNNER_TEMP/gh494-prepared/reviewed.patch"
          printf '%s\n' src/indexer/gh494_tests.rs src/indexer/mod.rs src/lib.rs src/search/gh494_repair_tests.rs src/search/inline_repair.rs src/search/mod.rs src/search/semantic_reader/publication/tests.rs tests/gh494_publish_resume.rs > "$RUNNER_TEMP/expected-paths"
          git diff --name-only | sort | diff - "$RUNNER_TEMP/expected-paths"
          { git rev-parse HEAD; rustc --version --verbose; cargo --version; } > "$RUNNER_TEMP/gh494-prepared/source-and-compiler.txt"
          echo 'STAGE=reviewed-patch-and-source-parse EXIT=0'
      - name: Execute exact repair-admission and failure-diagnostic helpers
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, tomllib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gh494-phase-harness'
          (root / 'src').mkdir(parents=True)
          packages = tomllib.loads(pathlib.Path('Cargo.lock').read_text())['package']
          deps = {name: next(p['version'] for p in packages if p['name'] == name) for name in ('anyhow', 'tracing', 'serde_json', 'tempfile')}
          manifest = '[package]\nname = "gh494-phase-harness"\nversion = "0.0.0"\nedition = "2024"\n[dependencies]\n'
          manifest += ''.join(f'{name} = "={version}"\n' for name, version in deps.items())
          (root / 'Cargo.toml').write_text(manifest)
          (root / 'src/lib.rs').write_text('mod lexical_publish;\nmod inline_repair;\n')
          shutil.copyfile('src/indexer/lexical_publish.rs', root / 'src/lexical_publish.rs')
          shutil.copyfile('src/search/inline_repair.rs', root / 'src/inline_repair.rs')
          PY
          cargo test --manifest-path "$RUNNER_TEMP/gh494-phase-harness/Cargo.toml" gh494_ -- --nocapture 2>&1 | tee "$RUNNER_TEMP/gh494-prepared/helpers.log"
          grep -F 'test result: ok. 16 passed; 0 failed;' "$RUNNER_TEMP/gh494-prepared/helpers.log"
          cargo clippy --manifest-path "$RUNNER_TEMP/gh494-phase-harness/Cargo.toml" --tests -- -D warnings 2>&1 | tee "$RUNNER_TEMP/gh494-prepared/helpers-clippy.log"
          echo 'STAGE=exact-helpers-16-tests-and-clippy EXIT=0'
      - name: Store reviewed immutable blobs without any ref update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          paths = ['src/indexer/gh494_tests.rs', 'src/indexer/mod.rs', 'src/lib.rs', 'src/search/gh494_repair_tests.rs', 'src/search/inline_repair.rs', 'src/search/mod.rs', 'src/search/semantic_reader/publication/tests.rs', 'tests/gh494_publish_resume.rs']
          report = {'base_commit': os.environ['GITHUB_SHA'], 'patch_blob': '1a8c49864ff29f7e89bf0f879894cc9785559d88', 'blobs': {}}
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              response = subprocess.run(['gh', 'api', '-H', 'User-Agent: OpenAI File Downloader, XaiImageApiFetch/1.0', '--method', 'POST', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs", '--input', '-'], input=payload, text=True, capture_output=True, check=True)
              sha = json.loads(response.stdout)['sha']
              assert sha == expected, (path, sha, expected)
              old = subprocess.run(['git', 'rev-parse', f'HEAD:{path}'], text=True, capture_output=True)
              report['blobs'][path] = {'before_sha': old.stdout.strip() if old.returncode == 0 else None, 'sha': sha}
          text = json.dumps(report, indent=2) + '\n'
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'gh494-prepared/blobs.json').write_text(text)
          print(text)
          PY
          tar -czf "$RUNNER_TEMP/gh494-prepared/candidate-source.tar.gz" src/indexer/gh494_tests.rs src/indexer/mod.rs src/lib.rs src/search/gh494_repair_tests.rs src/search/inline_repair.rs src/search/mod.rs src/search/semantic_reader/publication/tests.rs tests/gh494_publish_resume.rs
      - name: Preserve candidate and native validation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gh494-query-recovery-prepared-${{ github.sha }}
          path: ${{ runner.temp }}/gh494-prepared/
          if-no-files-found: warn
          retention-days: 14
