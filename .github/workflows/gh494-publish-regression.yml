name: Prepare reviewed atomic publication fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/gh494-publish-regression.yml']

# Temporary preparation of one reviewed patch. No branch/ref writes occur here.
# The explicit source commit restores the read-only regression workflow.
permissions:
  contents: read

concurrency:
  group: gh494-atomic-certification-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Dicklesworthstone/coding_agent_session_search' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          name = tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'name={name}', file=output)
          PY
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: ${{ steps.toolchain.outputs.name }}
          components: rustfmt
      - name: Apply only the reviewed patch to the reviewed blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gh494-prepared"
          test "$(git hash-object src/indexer/mod.rs)" = 512485aa2cad27f886326ae486bde1c16649ad24
          test "$(git hash-object src/indexer/lexical_publish.rs)" = 55e3f8bcba0dbf52b2b62c7aa7feafcd5935e0b2
          test "$(git hash-object src/indexer/gh494_tests.rs)" = 00fa2e10355bbfc572b6ecba071e6254d530b0cc
          test "$(git hash-object tests/gh494_publish_resume.rs)" = 97360316a5f0b300a8ee9ac0e777dfc27a3cdcb4
          gh api repos/${{ github.repository }}/git/blobs/d88d7587ebbcad8f7c7adc86efc7ce2429a087f9 --jq .content | base64 --decode > "$RUNNER_TEMP/reviewed.patch.gz"
          test "$(git hash-object "$RUNNER_TEMP/reviewed.patch.gz")" = d88d7587ebbcad8f7c7adc86efc7ce2429a087f9
          gzip --decompress --stdout "$RUNNER_TEMP/reviewed.patch.gz" > "$RUNNER_TEMP/reviewed.patch"
          test "$(git hash-object "$RUNNER_TEMP/reviewed.patch")" = 028f6f48a3e64795982ac1f6d44f102a5ee103e2
          git apply --check --whitespace=error "$RUNNER_TEMP/reviewed.patch"
          git apply --whitespace=error "$RUNNER_TEMP/reviewed.patch"
          gh api repos/${{ github.repository }}/git/blobs/62f7bd5db66c0e67aa7015301b6d7538692f65bc --jq .content | base64 --decode > "$RUNNER_TEMP/remove-cached-fingerprint.patch"
          test "$(git hash-object "$RUNNER_TEMP/remove-cached-fingerprint.patch")" = 62f7bd5db66c0e67aa7015301b6d7538692f65bc
          git apply --check --whitespace=error "$RUNNER_TEMP/remove-cached-fingerprint.patch"
          git apply --whitespace=error "$RUNNER_TEMP/remove-cached-fingerprint.patch"
          test "$(git hash-object src/indexer/mod.rs)" = f3796db5eb3b6a2a72222b9a7bc3a09ad283a752
          rustfmt --edition 2024 --config skip_children=true src/indexer/lexical_publish.rs src/indexer/gh494_tests.rs tests/gh494_publish_resume.rs
          rustfmt --edition 2024 --config skip_children=true --check src/indexer/lexical_publish.rs src/indexer/gh494_tests.rs tests/gh494_publish_resume.rs
          rustfmt --edition 2024 --config skip_children=true --emit stdout src/indexer/mod.rs > "$RUNNER_TEMP/mod.parsed.rs"
          git diff --check
          git diff --binary > "$RUNNER_TEMP/gh494-prepared/reviewed.patch"
          printf '%s\n' src/indexer/gh494_tests.rs src/indexer/lexical_publish.rs src/indexer/mod.rs tests/gh494_publish_resume.rs > "$RUNNER_TEMP/expected-paths"
          git diff --name-only | sort | diff - "$RUNNER_TEMP/expected-paths"
          { git rev-parse HEAD; rustc --version --verbose; cargo --version; } > "$RUNNER_TEMP/gh494-prepared/source-and-compiler.txt"
      - name: Run the exact diagnostic helper tests
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, tomllib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gh494-phase-harness'
          (root / 'src').mkdir(parents=True)
          packages = tomllib.loads(pathlib.Path('Cargo.lock').read_text())['package']
          deps = {name: next(p['version'] for p in packages if p['name'] == name) for name in ('anyhow', 'tracing', 'serde_json', 'tempfile')}
          manifest = '[package]\nname = "gh494-phase-harness"\nversion = "0.0.0"\nedition = "2024"\n[dependencies]\n'
          manifest += ''.join(f'{name} = "={version}"\n' for name, version in deps.items())
          (root / 'Cargo.toml').write_text(manifest)
          (root / 'src/lib.rs').write_text('mod lexical_publish;\n')
          shutil.copyfile('src/indexer/lexical_publish.rs', root / 'src/lexical_publish.rs')
          PY
          cargo test --manifest-path "$RUNNER_TEMP/gh494-phase-harness/Cargo.toml" gh494_ -- --nocapture 2>&1 | tee "$RUNNER_TEMP/gh494-prepared/diagnostics.log"
      - name: Store immutable candidate blobs without updating any ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          paths = ['src/indexer/mod.rs', 'src/indexer/lexical_publish.rs', 'src/indexer/gh494_tests.rs', 'tests/gh494_publish_resume.rs']
          report = {'base_commit': os.environ['GITHUB_SHA'], 'patch_blob': 'd88d7587ebbcad8f7c7adc86efc7ce2429a087f9', 'followup_patch_blob': '62f7bd5db66c0e67aa7015301b6d7538692f65bc', 'blobs': {}}
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              response = subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs", '--input', '-'], input=payload, text=True, capture_output=True, check=True)
              sha = json.loads(response.stdout)['sha']
              assert sha == expected, (path, sha, expected)
              before = subprocess.check_output(['git', 'rev-parse', f'HEAD:{path}'], text=True).strip()
              report['blobs'][path] = {'before_sha': before, 'sha': sha}
              print(path, sha)
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gh494-prepared/blobs.json'
          output.write_text(json.dumps(report, indent=2) + '\n')
          PY
          tar -czf "$RUNNER_TEMP/gh494-prepared/candidate-source.tar.gz" src/indexer/mod.rs src/indexer/lexical_publish.rs src/indexer/gh494_tests.rs tests/gh494_publish_resume.rs
      - name: Preserve source, diff, blob identities, and validation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gh494-atomic-publication-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/gh494-prepared/
          if-no-files-found: warn
          retention-days: 14
