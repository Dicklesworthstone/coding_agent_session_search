name: Raw mirror exclusion contract

on:
  push:
    branches: [main]
    paths:
      - 'src/raw_mirror.rs'
      - 'src/raw_mirror/**'
      - 'src/connectors/codex.rs'
      - 'src/connectors/codex/**'
      - 'scripts/test_raw_mirror_exclusions.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/raw-mirror-exclusions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Raw mirror (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Test real storage and exclusion boundary
        run: python scripts/test_raw_mirror_exclusions.py
