# The one-shot writer has completed. This workflow cannot change the repository.
name: Verify exact message retrieval
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check production message selection tests under the repository lockfile
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check src/search/query/message_topk.rs src/search/query/message_topk_integration.rs
          cargo test --locked --lib search::query::message_topk -- --nocapture 2>&1 | tee "$RUNNER_TEMP/message-topk-tests.log"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          text = (Path(os.environ['RUNNER_TEMP']) / 'message-topk-tests.log').read_text()
          counts = re.findall(r'test result: ok\. (\d+) passed; 0 failed;', text)
          if not counts or max(map(int, counts)) < 20:
              raise SystemExit('No passing receipt for all message selection regressions')
          PY
