# Read-only verification; no runner has permission to publish source changes.
name: Verify search retrieval
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-message-topk-once.yml
      - src/search/query.rs
      - src/search/query/**
      - src/search/vector_index.rs
      - src/search/ann_index.rs
      - scripts/verify_ann_shards.py
      - scripts/verify_message_topk_fsvi.py
permissions:
  contents: read
concurrency:
  group: cass-search-retrieval-${{ github.ref }}
  cancel-in-progress: false
jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: cass-source
          persist-credentials: false
      - name: Preserve the exact source under review
        shell: bash
        working-directory: cass-source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/search-source"
          git rev-parse HEAD > "$RUNNER_TEMP/search-source/commit.txt"
          git archive --format=tar.gz HEAD AGENTS.md README.md Cargo.toml Cargo.lock rust-toolchain.toml src scripts tests docs/planning .beads/issues.jsonl > "$RUNNER_TEMP/search-source/source.tar.gz"
          sha256sum "$RUNNER_TEMP/search-source/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search-source-${{ github.sha }}
          path: ${{ runner.temp }}/search-source/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dicklesworthstone/frankensearch
          ref: 6852e79a830c402ea4e55eb79eda3373c618dfc3
          path: fs-source
          persist-credentials: false
      - name: Compile and execute the production retrieval components with real FSVI and HNSW
        shell: bash
        working-directory: cass-source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/search-evidence"
          rustc --version | tee "$RUNNER_TEMP/search-evidence/toolchain.txt"
          python3 scripts/verify_ann_shards.py "$PWD" "$GITHUB_WORKSPACE/fs-source" "$RUNNER_TEMP/cass-search-components" | tee "$RUNNER_TEMP/search-evidence/source-receipt.txt"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cass-search-target"
          cd "$RUNNER_TEMP/cass-search-components"
          cargo generate-lockfile
          cp Cargo.lock "$RUNNER_TEMP/search-evidence/component-Cargo.lock"
          cargo test --locked -- --nocapture --test-threads=2 2>&1 | tee "$RUNNER_TEMP/search-evidence/tests.log"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'search-evidence/tests.log').read_text()
          counts = re.findall(r'test result: ok\. (\d+) passed; 0 failed;', text)
          if not counts or max(map(int, counts)) < 34:
              raise SystemExit('Expected at least 34 passing production component tests')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: search-component-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/search-evidence/
          if-no-files-found: warn
          retention-days: 14
  locked-cass:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check full CASS retrieval under its unmodified lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib search::query:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/locked-cass.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: search-locked-cass-${{ github.sha }}
          path: ${{ runner.temp }}/locked-cass.log
          if-no-files-found: warn
          retention-days: 14
