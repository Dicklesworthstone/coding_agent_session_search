name: GH493 canonical anchor candidate

on:
  push:
    branches: [main]
    paths: [.github/workflows/gh493-coordinate-candidate.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'Dicklesworthstone/coding_agent_session_search'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db
        with:
          shared-key: gh493-identity
          cache-on-failure: true
      - name: Prepare the exact error-envelope repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          expected = {
              'src/lib.rs': 'a2948887aaa29da64015210ea28accab11490291',
              'tests/gh493_message_coordinates.rs': 'fb0957a1e56f668f4620a552495fc30512c0a1b2',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != sha:
                  raise SystemExit(f'Refusing changed source: {path}: {actual} != {sha}')
          def blob(sha):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              assert result['encoding'] == 'base64'
              return base64.b64decode(result['content'])
          patch = blob('152d9a835341cf0825ba7d8123c8ad27903e45b2')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          with open('tests/gh493_message_coordinates.rs', 'a') as output:
              output.write(blob('e2e5b0b7bfa949a95eb7b524034431ed3b44164e').decode())
          PY
      - name: Format only changed sources
        run: |
          rustfmt --edition 2024 --config skip_children=true src/lib.rs tests/gh493_message_coordinates.rs
          git diff --check
          git diff --stat
      - name: Publish prepared blobs only, never commits or refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess, urllib.request
          paths = ['src/lib.rs', 'tests/gh493_message_coordinates.rs']
          assert set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) == set(paths)
          manifest = {'base_commit': os.environ['GITHUB_SHA'], 'base_blobs': {}, 'candidate_blobs': {}}
          for path in paths:
              manifest['base_blobs'][path] = subprocess.check_output(['git', 'rev-parse', f'HEAD:{path}'], text=True).strip()
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs',
                  data=json.dumps({'content': pathlib.Path(path).read_text(), 'encoding': 'utf-8'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  sha = json.load(response)['sha']
              assert sha == subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              manifest['candidate_blobs'][path] = sha
              dest = pathlib.Path('candidate') / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, dest)
          pathlib.Path('candidate/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          pathlib.Path('candidate/review.patch').write_bytes(subprocess.check_output(['git', 'diff']))
          print('GH493_ERROR_CANDIDATE\n' + json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gh493-error-envelope-candidate
          path: candidate/
          retention-days: 3
      - name: Canonical round trips, error envelopes and field masks
        run: cargo test --locked --no-fail-fast --test gh493_message_coordinates --test spec_view_expand_error_envelopes --test spec_field_mask_contract -- --nocapture
      - name: Existing view compatibility
        if: ${{ !cancelled() }}
        run: cargo test --locked --test cli_robot view_
      - name: Existing field projection contracts
        if: ${{ !cancelled() }}
        run: cargo test --locked --test cli_robot fields_
      - name: Successful recovery still emits its teaching note
        if: ${{ !cancelled() }}
        run: cargo test --locked --test cli_robot robot_mode_auto_correction_emits_teaching_note_on_stderr
      - name: Capabilities contract
        if: ${{ !cancelled() }}
        run: cargo test --locked --test cli_robot capabilities_matches_golden_contract
      - name: Strict production lint
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --test gh493_message_coordinates -- -D warnings
