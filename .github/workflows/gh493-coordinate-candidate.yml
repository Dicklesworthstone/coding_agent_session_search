name: GH493 canonical anchor candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gh493-coordinate-candidate.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db
        with:
          shared-key: gh493-identity
          cache-on-failure: true
      - name: Admit exact reviewed terminal and pack changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          inputs = {'src/ui/data.rs': '90ea9d061f36ef033368918fec3566fe8d176403', 'src/ui/app.rs': 'edd9e357f0f7b1201159863c5c0535f3e7944fd5', 'src/search/pack_planner.rs': 'ce87c5a4abbeb79b9836afb9d42e0299e6d9f98f'}
          outputs = {'src/ui/data.rs': 'e53dbac9fc2532c1d19f7031d24cea2e1e04c072', 'src/ui/app.rs': '1da4c2e5229e8bf90c39097477b389901db8b726', 'src/search/pack_planner.rs': '06aa863270e5899bb8faa959ca2ba3bcf147aa58'}
          for path, sha in inputs.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha, path
          sha = 'c406129b9acf8864abd8520c4167b73dc179724c'
          request = urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'cass-canonical-tui-review'})
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result['encoding'] == 'base64'
          patch = base64.b64decode(result['content'])
          assert hashlib.sha1(b'blob ' + str(len(patch)).encode() + b'\0' + patch).hexdigest() == sha
          command = ['git', 'apply', '--recount', '--unidiff-zero']
          subprocess.run(command + ['--check', '-'], input=patch, check=True)
          subprocess.run(command + ['-'], input=patch, check=True)
          for path, sha in outputs.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha, path
          pathlib.Path('candidate').mkdir()
          pathlib.Path('candidate/input-blobs.json').write_text(json.dumps(inputs, indent=2))
          PY
      - name: Format and verify complete changed sources
        run: |
          rustfmt --edition 2024 --config skip_children=true src/ui/data.rs src/ui/app.rs src/search/pack_planner.rs
          git diff --check
      - name: Publish reviewed blobs only, never commits or refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess, urllib.request
          inputs = json.loads(pathlib.Path('candidate/input-blobs.json').read_text())
          assert set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) == set(inputs)
          manifest = {'base_commit': os.environ['GITHUB_SHA'], 'base_blobs': inputs, 'candidate_blobs': {}}
          for path in inputs:
              request = urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs', data=json.dumps({'content': pathlib.Path(path).read_text(), 'encoding': 'utf-8'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'cass-canonical-tui-review'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  sha = json.load(response)['sha']
              assert sha == subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              manifest['candidate_blobs'][path] = sha
              destination = pathlib.Path('candidate') / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, destination)
          pathlib.Path('candidate/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          pathlib.Path('candidate/review.patch').write_bytes(subprocess.check_output(['git', 'diff']))
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tui-canonical-candidate
          path: candidate/
          retention-days: 1
          if-no-files-found: error
      - name: Real archive lookup and canonical terminal regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib gh493_ -- --nocapture 2>&1 | tee candidate/tui-regressions.log
          grep -F 'test result: ok. 6 passed;' candidate/tui-regressions.log
          cargo test --locked --lib ui::data::tests -- --nocapture 2>&1 | tee candidate/data-tests.log
      - name: Existing detail rendering and navigation contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib ui::app::tests::regression_detail -- --nocapture 2>&1 | tee candidate/detail-tests.log
          cargo test --locked --lib ui::app::tests::build_messages -- --nocapture 2>&1 | tee candidate/messages-tests.log
          cargo test --locked --lib ui::app::tests::detail_session_hit -- --nocapture 2>&1 | tee candidate/navigation-tests.log
      - name: Complete pack planner and physical citation regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib search::pack_planner::tests -- --nocapture 2>&1 | tee candidate/planner-tests.log
      - name: Preserve real CLI coordinate and pack handoffs
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --no-fail-fast --test gh493_message_coordinates --test gh493_reported_coordinates --test gh493_windowed_followup --test cli_view_budget --test lexical_reconcile_canary --test golden_robot_pack -- --nocapture 2>&1 | tee candidate/cli-tests.log
      - name: Strict production and targeted regression lint
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --lib --test gh493_message_coordinates -- -D warnings 2>&1 | tee candidate/clippy.log
      - name: Retain completed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tui-canonical-validation
          path: candidate/
          retention-days: 1
          if-no-files-found: warn
