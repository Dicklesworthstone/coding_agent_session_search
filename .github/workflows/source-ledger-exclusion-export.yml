name: Source ledger exclusion export
on:
  push:
    branches: [main]
    paths: [.github/workflows/source-ledger-exclusion-export.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Execute exact reviewed exporter without ref changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          sha = 'c781d9ed081bf3140b00c889d64b65f4ab371f6f'
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result['encoding'] == 'base64'
          source = base64.b64decode(result['content'])
          assert hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest() == sha
          assert hashlib.sha256(source).hexdigest() == '02ceac9597c14d188cc2acbc605d149756ee83b7f154d6ffcc0e8914d5173c14'
          exec(compile(source, 'reviewed-exclusion-export', 'exec'), {'__name__': '__main__'})
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gh512-exclusions-source-${{ github.sha }}-${{ matrix.os }}
          path: |
            gh512-exclusions-source.json
            gh512-exclusions-source.tar.gz
          if-no-files-found: error
          retention-days: 7
