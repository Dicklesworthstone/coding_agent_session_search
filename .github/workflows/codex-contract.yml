name: Codex consumer contract

on:
  push:
    branches: [main]
    paths:
      - 'src/connectors/codex.rs'
      - 'src/connectors/codex/**'
      - 'tests/connector_codex_exclusions.rs'
      - 'tests/codex_source_containment.rs'
      - 'scripts/test_codex_contract.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/codex-contract.yml'
  pull_request:
    paths:
      - 'src/connectors/codex.rs'
      - 'src/connectors/codex/**'
      - 'tests/connector_codex_exclusions.rs'
      - 'tests/codex_source_containment.rs'
      - 'scripts/test_codex_contract.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/codex-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex:
    name: Codex consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Test production Codex wrapper and exclusion contract
        run: python scripts/test_codex_contract.py
      # The upstream source of the FAD release CASS pins (v0.3.8). Earlier
      # baselines lack APIs CASS calls: set_codex_rollout_byte_budget (0.3.2)
      # and the compressed-rollout helpers behind codex-zstd (0.3.6, GH #513).
      - name: Checkout upstream reader compatibility baseline
        uses: actions/checkout@v4
        with:
          repository: Dicklesworthstone/franken_agent_detection
          ref: 99ae86cdf8c71c53cec1df5760766038eca20375
          path: consumer/fad
          persist-credentials: false
      - name: Test CASS source boundaries with the upstream snapshot reader
        run: python scripts/test_codex_contract.py --fad-checkout consumer/fad
