name: Metadata-only ingestion regression

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ingest-metadata-regression.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: Locked committed metadata, source and CLI regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
      RUSTFLAGS: '-Zthreads=1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read pinned toolchain and record committed sources
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ingest-metadata-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/ingest-metadata-evidence/revision.txt"
          git diff --exit-code HEAD
          cp Cargo.lock "$RUNNER_TEMP/ingest-metadata-evidence/Cargo.lock"
          python3 - <<'PY'
          import hashlib, json, os, tomllib
          from pathlib import Path
          paths = ['src/storage/sqlite.rs', 'src/indexer/mod.rs',
                   'src/connectors/source_dependencies/observation.rs']
          blobs = {}
          for path in paths:
              data = Path(path).read_bytes()
              blobs[path] = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          evidence = Path(os.environ['RUNNER_TEMP']) / 'ingest-metadata-evidence'
          (evidence / 'committed-blobs.json').write_text(json.dumps(blobs, indent=2))
          channel = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'channel={channel}\n')
          PY
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db
        with:
          key: codebuff-native-ubuntu-24.04
          cache-on-failure: true
      - name: Qualify committed workspace repair and source evidence
        shell: bash
        run: |
          # 86e171fa landed the production workspace fix with canonical-source
          # ownership and conservative absent-sidecar semantics. Test that code,
          # not the older successful candidate overlay with different semantics.
          set +e
          set -uo pipefail
          evidence="$RUNNER_TEMP/ingest-metadata-evidence"
          failed=0
          cargo_cmd=(cargo --config 'profile.dev.package.asupersync.codegen-units=256' --config 'profile.dev.package.asupersync.opt-level=0')
          run_gate() {
            local stage="$1" kind="$2" rc
            shift 2
            "$@" 2>&1 | tee "$evidence/$stage.log"
            local statuses=("${PIPESTATUS[@]}")
            rc=${statuses[0]}
            [ "${statuses[1]}" -eq 0 ] || rc=1
            if [ "$kind" = test ] && [ "$rc" -eq 0 ]; then
              bash scripts/gate.sh --verify-test-log "$evidence/$stage.log" || rc=1
            fi
            printf 'STAGE=%s EXIT=%s\n' "$stage" "$rc" | tee -a "$evidence/receipt.log" || failed=1
            [ "$rc" -eq 0 ] || failed=1
          }
          run_gate compiler command rustc --version --verbose
          run_gate metadata-storage test "${cargo_cmd[@]}" test --locked --lib codebuff_run_state_workspace_replaces_the_canonical_workspace_on_replay -- --nocapture --test-threads=1
          run_gate existing-codebuff-storage test "${cargo_cmd[@]}" test --locked --lib gh423_codebuff_ -- --nocapture --test-threads=1
          run_gate source-observations test "${cargo_cmd[@]}" test --locked --lib connectors::source_dependencies::observation:: -- --nocapture --test-threads=1
          run_gate source-reuse test "${cargo_cmd[@]}" test --locked --test codebuff_source_reuse -- --nocapture --test-threads=1
          run_gate exclusions test "${cargo_cmd[@]}" test --locked --test codebuff_exclusions -- --nocapture --test-threads=1
          run_gate gh511 test "${cargo_cmd[@]}" test --locked --test e2e_multi_connector gh511_ -- --nocapture --test-threads=1
          run_gate timestamp-contract test "${cargo_cmd[@]}" test --locked --test codebuff_timestamp_contract -- --nocapture --test-threads=1
          run_gate fmt command rustfmt --edition 2024 --check --config skip_children=true src/storage/sqlite.rs src/indexer/mod.rs src/connectors/source_dependencies/observation.rs
          run_gate clippy command "${cargo_cmd[@]}" clippy --locked --lib --bin cass --test codebuff_source_reuse --test codebuff_exclusions --test e2e_multi_connector --test codebuff_timestamp_contract -- -D warnings
          run_gate source-unchanged command git diff --exit-code HEAD
          printf 'STAGE=job-complete EXIT=%s\n' "$failed" | tee -a "$evidence/receipt.log" || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ingest-metadata-committed-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ingest-metadata-evidence/
          if-no-files-found: error
          retention-days: 7
