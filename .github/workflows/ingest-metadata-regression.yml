name: Metadata-only ingestion regression

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ingest-metadata-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Prepare exact reviewed workspace repair
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      blobs: ${{ steps.prepare.outputs.blobs }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          channel = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'channel={channel}\n')
          PY
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - name: Apply exact-base repair and retain formatted Git objects
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This script uploads immutable blobs only. It cannot create commits
          # or move refs; direct-main publication remains an expected-head action.
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          sha = 'ef932a6d7ec10d939b5a996ad9669b545db07581'
          request = urllib.request.Request(
              'https://api.github.com/repos/Dicklesworthstone/coding_agent_session_search/git/blobs/' + sha,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=120) as response:
              data = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
          exec(compile(data, 'reviewed-metadata-preparer.py', 'exec'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ingest-metadata-reviewed-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ingest-metadata-source/
          if-no-files-found: error
          retention-days: 7
  native:
    name: Locked metadata-only CLI and storage regressions
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
      RUSTFLAGS: '-Zthreads=1'
      REVIEWED_BLOBS: ${{ needs.source.outputs.blobs }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read pinned toolchain and exact candidate sources
        id: toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, tomllib, urllib.request
          from pathlib import Path
          for path, sha in json.loads(os.environ['REVIEWED_BLOBS']).items():
              request = urllib.request.Request(
                  'https://api.github.com/repos/Dicklesworthstone/coding_agent_session_search/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  data = base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          channel = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'channel={channel}\n')
          PY
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db
        with:
          key: codebuff-native-ubuntu-24.04
          cache-on-failure: true
      - name: Qualify existing assertions and workspace repair
        shell: bash
        run: |
          set +e
          set -uo pipefail
          evidence="$RUNNER_TEMP/ingest-metadata-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD | tee "$evidence/base-revision.txt"
          printf '%s\n' "$REVIEWED_BLOBS" > "$evidence/reviewed-blobs.json"
          cp Cargo.lock "$evidence/Cargo.lock"
          failed=0
          cargo_cmd=(cargo --config 'profile.dev.package.asupersync.codegen-units=256' --config 'profile.dev.package.asupersync.opt-level=0')
          run_gate() {
            local stage="$1" kind="$2" rc
            shift 2
            "$@" 2>&1 | tee "$evidence/$stage.log"
            local statuses=("${PIPESTATUS[@]}")
            rc=${statuses[0]}
            [ "${statuses[1]}" -eq 0 ] || rc=1
            if [ "$kind" = test ] && [ "$rc" -eq 0 ]; then
              bash scripts/gate.sh --verify-test-log "$evidence/$stage.log" || rc=1
            fi
            printf 'STAGE=%s EXIT=%s\n' "$stage" "$rc" | tee -a "$evidence/receipt.log"
            [ "$rc" -eq 0 ] || failed=1
          }
          run_gate compiler command rustc --version --verbose
          run_gate metadata-storage test "${cargo_cmd[@]}" test --locked --lib storage::sqlite::codebuff_metadata::tests -- --nocapture --test-threads=1
          run_gate existing-codebuff-storage test "${cargo_cmd[@]}" test --locked --lib gh423_codebuff_ -- --nocapture --test-threads=1
          run_gate source-reuse test "${cargo_cmd[@]}" test --locked --test codebuff_source_reuse -- --nocapture --test-threads=1
          run_gate exclusions test "${cargo_cmd[@]}" test --locked --test codebuff_exclusions -- --nocapture --test-threads=1
          run_gate fmt command rustfmt --edition 2024 --check --config skip_children=true src/storage/sqlite.rs src/storage/sqlite/codebuff_metadata.rs src/storage/sqlite/codebuff_metadata/tests.rs src/indexer/mod.rs
          run_gate clippy command "${cargo_cmd[@]}" clippy --locked --lib --bin cass --test codebuff_source_reuse --test codebuff_exclusions -- -D warnings
          run_gate source-unchanged command python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          blobs = json.loads(os.environ['REVIEWED_BLOBS'])
          for path, expected in blobs.items():
              data = Path(path).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == expected, path
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert not changed - set(blobs), changed
          PY
          printf 'STAGE=job-complete EXIT=%s\n' "$failed" | tee -a "$evidence/receipt.log"
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ingest-metadata-native-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ingest-metadata-evidence/
          if-no-files-found: error
          retention-days: 7
