# Qualify the real native caller before publishing its guarded integration.
name: Exact message streaming
on:
  push:
    branches: [main]
    paths:
      - 'src/search/query/message_stream.rs'
      - 'src/search/query/message_stream/**'
      - 'scripts/apply_exact_message_stream.py'
      - '.github/workflows/exact-message-stream.yml'
permissions:
  contents: write
jobs:
  integrate-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Integrate exact call sites on the recorded main revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exact-message-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/exact-message-evidence/tested-base.txt"
          python3 scripts/apply_exact_message_stream.py | tee "$RUNNER_TEMP/exact-message-evidence/integration.txt"
          rustc --version | tee "$RUNNER_TEMP/exact-message-evidence/toolchain.txt"
          rustfmt --edition 2024 --config skip_children=true src/search/query.rs
          rustfmt --edition 2024 src/search/query/message_stream.rs
          git diff --check
          git diff -- src/search/query.rs src/search/query/message_stream.rs src/search/query/message_stream/tests.rs src/search/query/message_stream/retained_wal.rs src/search/query/message_stream/retained_wal/tests.rs > "$RUNNER_TEMP/exact-message-evidence/source.diff"
      - name: Differential tests on real FSVI, WAL, and the integrated CASS driver
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib search::query::message_stream:: -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-message-evidence/streaming.log"
          cargo test --locked --lib search::query::message_topk -- --nocapture --test-threads=2 2>&1 | tee "$RUNNER_TEMP/exact-message-evidence/existing-exact.log"
          cargo test --locked --lib search::query::ann_shards -- --nocapture --test-threads=2 2>&1 | tee "$RUNNER_TEMP/exact-message-evidence/existing-ann.log"
          cargo clippy --locked --lib -- -D warnings 2>&1 | tee "$RUNNER_TEMP/exact-message-evidence/clippy.log"
      - name: Publish the tested integration without rewriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git add src/search/query.rs src/search/query/message_stream.rs src/search/query/message_stream/tests.rs src/search/query/message_stream/retained_wal.rs src/search/query/message_stream/retained_wal/tests.rs
          if git diff --cached --quiet; then
            echo 'Integration already present; no commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(search): activate complete bounded exact message selection' -m 'Preserve the ordinary proven no-WAL first window. Unresolved standard-width cohorts use single-pass message selection; retained-WAL cohorts select current main-plus-delta messages before raw-window exhaustion shortcuts. Legacy widths use the exact backend byte kernels; large WALs use bounded borrowed shadow references or return an explicit resource error. Validate against real FSVI/WAL differential tests, existing exact/ANN regressions and locked lib Clippy. Preserve the false-empty and output assertions while constructing the intended pre-cleanup WAL image from production-serialized files. No dependency or acceptance-gate changes.'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD | tee "$RUNNER_TEMP/exact-message-evidence/published-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-message-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/exact-message-evidence/
          if-no-files-found: error
          retention-days: 14
