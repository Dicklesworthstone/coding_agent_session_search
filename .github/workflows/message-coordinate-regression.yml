name: Message coordinate regressions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/message-coordinate-regression.yml
      - src/lib.rs
      - src/followup_coordinates.rs
      - src/search/query.rs
      - tests/gh493_message_coordinates.rs
      - tests/message_coordinates.rs
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cass-message-coordinates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/coding_agent_session_search'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and compiler identity
        run: git rev-parse HEAD && rustc --version && cargo --version
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db
      - name: Check coordinate implementation formatting
        run: rustfmt --edition 2024 --config skip_children=true --check src/lib.rs src/search/query.rs src/followup_coordinates.rs tests/gh493_message_coordinates.rs
      - name: Run search-to-follow-up regressions
        run: cargo test --locked --test gh493_message_coordinates -- --nocapture
