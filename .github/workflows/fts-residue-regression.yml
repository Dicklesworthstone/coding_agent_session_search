name: Fallback FTS residue regressions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fts-residue-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Apply reviewed residue repair
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/fts-residue.patch"
          echo "5f059132ffdb8d2d3f638386b2e88ff8199ee70e50308adb82c28ae12d9c0ce0  $RUNNER_TEMP/fts-residue.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/fts-residue.patch"
          git apply "$RUNNER_TEMP/fts-residue.patch"
          rustfmt --edition 2024 --config skip_children=true src/storage/sqlite.rs src/doctor_recover.rs src/indexer/mod.rs src/lib.rs
          git diff --check
          git diff --stat
      - name: Publish repair directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/storage/sqlite.rs src/doctor_recover.rs src/indexer/mod.rs src/lib.rs
          git diff --cached --check
          git commit -m 'fix(fts): repair residue and converge retired fallback shadows (#495)'
          git push origin HEAD:main
      - name: Preserve exact patched sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fts-repair-sources
          retention-days: 3
          include-hidden-files: true
          path: |
            src/storage/
            src/doctor_recover.rs
            src/indexer/mod.rs
            src/lib.rs
            src/franken_sync.rs
            src/model/types.rs
            Cargo.toml
            Cargo.lock
            rust-toolchain.toml
            .cargo/config.toml
            AGENTS.md
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run residue and convergence regressions
        run: |
          cargo test --locked --lib fts_residue -- --test-threads=1
          cargo test --locked --lib fts_shadow_ -- --test-threads=1
          cargo test --locked --lib fts_contentless_docsize -- --test-threads=1
          cargo test --locked --lib fts_repair_refuses_an_active_index_lease -- --test-threads=1
          cargo test --locked --lib fallback_fts -- --test-threads=1
