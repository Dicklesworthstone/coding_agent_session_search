name: Codebuff native consumer regression

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codebuff-regression.yml
      - .cargo/config.toml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - build.rs
      - AGENTS.md
      - README.md
      - src/connector_ingest_diagnostics.rs
      - src/connectors/**
      - src/dependency_drift.rs
      - src/indexer/**
      - src/lib.rs
      - tests/e2e_multi_connector.rs
      - tests/docs_dependency_pins_match_cargo.rs
      - tests/agent_detection_completeness.rs
      - tests/util/**
      - scripts/check_dependency_features.py
      - scripts/gate.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cass-codebuff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Codebuff native CASS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    # The first native macOS cold build took 52m27s before running tests
    # (run 37440874690, job 112194036236). Its five GH511 regressions and
    # native-update test passed, but the 55-minute step budget then killed
    # library-test compilation. Leave bounded time for the remaining gates
    # plus setup/evidence upload; do not skip gates or require a warm cache.
    timeout-minutes: ${{ matrix.os == 'macos-14' && 120 || 60 }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: ${{ matrix.os == 'macos-14' && '1' || '2' }}
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
      RUSTFLAGS: '-Zthreads=1'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read the repository toolchain and record the source
        id: toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codebuff-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/codebuff-evidence/revision.txt"
          cp Cargo.lock "$RUNNER_TEMP/codebuff-evidence/Cargo.lock"
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          channel = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'channel={channel}\n')
          print(f'Repository toolchain: {channel}')
          PY
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db
        with:
          key: codebuff-native-${{ matrix.os }}
          cache-on-failure: true
      - name: Qualify the locked CASS connector and indexing contracts
        timeout-minutes: ${{ matrix.os == 'macos-14' && 110 || 55 }}
        run: |
          # Run the full root consumer on each actual OS. No dependency
          # overlays, generated consumer crates, or simulated platform flags.
          set +e
          set -uo pipefail
          evidence="$RUNNER_TEMP/codebuff-evidence"
          failed=0
          # The locked Asupersync 0.5.0 build was OOM-killed at opt-level 1
          # with one compiler thread and debug info disabled. This explicit
          # package profile reduces optimization work for functional tests; it
          # does not qualify release optimization or performance.
          cargo_cmd=(cargo
            --config 'profile.dev.package.asupersync.codegen-units=256'
            --config 'profile.dev.package.asupersync.opt-level=0')
          printf 'BUILD_JOBS=%s RUSTFLAGS=%s RUST_MIN_STACK=%s\n' \
            "$CARGO_BUILD_JOBS" "$RUSTFLAGS" "$RUST_MIN_STACK" | tee -a "$evidence/receipt.log" || failed=1
          run_gate() {
            local stage="$1" kind="$2" log rc counts
            shift 2
            log="$evidence/$stage.log"
            {
              printf 'STAGE=%s COMMAND=' "$stage"
              printf ' %q' "$@"
              printf '\n'
            } | tee -a "$evidence/receipt.log" || failed=1
            "$@" 2>&1 | tee "$log"
            local statuses=("${PIPESTATUS[@]}")
            rc=${statuses[0]}
            [ "${statuses[1]}" -eq 0 ] || rc=1
            if [ "$kind" = test ] && [ "$rc" -eq 0 ]; then
              # This early verifier uses only portable awk; it does not
              # enter gate.sh's GNU-tooling-dependent fleet build path.
              if counts="$(bash scripts/gate.sh --verify-test-log "$log")"; then
                printf 'TEST_COUNT=%s %s\n' "$stage" "$counts" | tee -a "$evidence/receipt.log" || failed=1
              else
                echo "Missing, empty, or incomplete test results: $stage" >&2
                rc=1
              fi
            fi
            printf 'STAGE=%s EXIT=%s\n' "$stage" "$rc" | tee -a "$evidence/receipt.log" || failed=1
            [ "$rc" -eq 0 ] || failed=1
          }
          run_gate compiler command rustc --version --verbose
          run_gate dependency-features command python scripts/check_dependency_features.py
          run_gate fmt command rustfmt --edition 2024 --check --config skip_children=true \
            build.rs src/lib.rs src/connector_ingest_diagnostics.rs src/dependency_drift.rs \
            src/indexer/mod.rs tests/e2e_multi_connector.rs \
            tests/docs_dependency_pins_match_cargo.rs tests/agent_detection_completeness.rs
          run_gate gh511 test "${cargo_cmd[@]}" test --locked --test e2e_multi_connector gh511_ -- --nocapture --test-threads=1
          run_gate native-updates test "${cargo_cmd[@]}" test --locked --test e2e_multi_connector \
            codebuff_cli_indexes_shared_manicode_history_and_updates_native_messages -- --exact --nocapture --test-threads=1
          run_gate connector-diagnostics test "${cargo_cmd[@]}" test --locked --lib connector_ingest_diagnostics::tests -- --nocapture --test-threads=1
          run_gate dependency-drift test "${cargo_cmd[@]}" test --locked --lib dependency_drift::tests -- --nocapture --test-threads=1
          run_gate indexer-progress test "${cargo_cmd[@]}" test --locked --lib -- \
            batch_index_does_not_watermark_failed_discovered_connector \
            gh426_batch_watermarks_only_fully_persisted_connectors_without_active_sources \
            batch_configured_scan_roots_ignore_global_watermark \
            batch_configured_local_scan_roots_honor_connector_watermark \
            streaming_consumer_does_not_watermark_connector_after_prior_scan_error \
            --nocapture --test-threads=1
          run_gate documentation-pins test "${cargo_cmd[@]}" test --locked --test docs_dependency_pins_match_cargo -- --nocapture --test-threads=1
          run_gate detection-completeness test "${cargo_cmd[@]}" test --locked --test agent_detection_completeness -- --nocapture --test-threads=1
          run_gate clippy command "${cargo_cmd[@]}" clippy --locked --lib --bin cass \
            --test e2e_multi_connector --test docs_dependency_pins_match_cargo \
            --test agent_detection_completeness -- -D warnings
          run_gate source-unchanged command git diff --exit-code
          printf 'STAGE=job-complete EXIT=%s\n' "$failed" | tee -a "$evidence/receipt.log" || failed=1
          exit "$failed"
      - name: Retain native compiler, test and dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          # A retry must preserve the earlier attempt's partial evidence,
          # not collide with its immutable artifact or overwrite it.
          name: codebuff-native-${{ matrix.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codebuff-evidence/
          if-no-files-found: error
          retention-days: 7
