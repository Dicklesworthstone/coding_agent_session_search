name: Search resource admission qualification

on:
  push:
    branches: [main]
    paths: [.github/workflows/search-resource-regression.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - name: Apply only the reviewed hash-bound source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, zlib
          from pathlib import Path
          expected = {'src/search_service.rs': 'ad002da61da9de6e0e88f8ba23deeeed67167069', 'src/search_service/admission.rs': None, 'src/search_service/canonical_tests.rs': '88f92ff093f665f9f878c35b3d18778aeda51760', 'src/search_service/mcp.rs': 'd1b9f40162bda1c09193dc7e1efb6146e52e1888', 'src/search_service/mcp_tests.rs': '5cc4ad3a004dc63e079ad282199773e1b7975db6', 'src/search_service/protocol.rs': 'd508ffb62f22a3b79555aec19d268ddec222ef6c', 'src/search_service/tests.rs': '0a1820a02b01d2724df2981ed8645a83aecef611', 'tests/search_service.rs': '8236cdfc8fba7ac320c2d280c5a017fe8b40e80b', 'docs/SEARCH_SERVICE.md': '90c2deaa1c51a1f298b3edd2dd82381ba9cb6208'}
          for name, sha in expected.items():
              path = Path(name)
              if sha is None:
                  assert not path.exists(), name
              else:
                  data = path.read_bytes()
                  assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha, name
          payload = (
              ''
              ''
              ''
          )
          patch = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == '0f237a0dce833ac347b182c00e3cf2dfc04ee466f64ba8369e6e37aae77cf0b8'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--reverse', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '-N', 'src/search_service/admission.rs'], check=True)
          doc = Path('docs/SEARCH_SERVICE.md')
          text = doc.read_text()
          for old, new in [('Four operations are always available:', 'Five operations are always available:'), ('{"op":"reload","id":3}\n{"op":"shutdown","id":4}', '{"op":"reload","id":3}\n{"op":"unload","id":4}\n{"op":"shutdown","id":5}'), ('Semantic/HNSW serving and cross-process admission are not implemented by this\nlexical endpoint.', 'Semantic/HNSW serving is not implemented by this lexical endpoint. Optional\nshared reader admission is described below; it bounds owners, not total RSS.'), ('The stable catalog exposes `cass_search`, `cass_status`, and `cass_reload`.', 'The catalog exposes `cass_search`, `cass_status`, `cass_unload`, and `cass_reload`.'), ('id`; status and reload accept an empty object.', 'id`; status, unload and reload accept an empty object.')]:
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          text += '\n## Shared reader admission (explicit opt-in)\n\nUse `--admission-dir /trusted/local/cass-reader-pool --admission-slots 1`\non `cass serve --stdio` or `cass serve --stdio --mcp`. Every cooperating\nworker must use the same local directory and slot count, including workers\nserving different indexes. Counts are 1–64, default one. Without the directory\noption, shared admission is disabled. This is not a query relay: reuse an\nadmitted worker for repeated queries.\n\nA worker acquires one kernel-backed lease before opening its lexical reader\nand retains it through reader destruction. A canonical view uses the existing\nlease or a temporary one through archive close. Busy admission returns\n`admission_busy` before index-open or canonical-read counters advance. Failed\nopens release their temporary lease. Status and invalid requests do not\ninitialize or inspect the pool.\n\n`unload` / MCP `cass_unload` releases the reader and then its lease without\nclosing the connection. The next query reacquires and reopens. Reload also\nreleases first; another process can win the slot, leaving a failed reloader\nunloaded. Kernel locks release on process termination; PIDs and timestamps\nare not ownership certificates. Existing deadlines and source checks remain.\n\nThis explicit option writes only a versioned policy and fixed slot lock files.\nChoose a private trusted local directory outside indexes and source trees.\nNever delete, replace or move pool files or the directory while workers may\nbe alive: this splits the lock namespace. Different slot counts and partial\npolicies fail closed with `admission_policy_mismatch`; there is no automatic\nrepair or stale-file deletion. Symlink preflight is not an atomic sandbox\nagainst a hostile directory owner; network-filesystem locking is unqualified.\n\nThe limit covers participating reader owners, not total machine memory. Other\nprograms, workers without the option, and allocator-retained pages after\nunload are outside the count. Status reports the scope, slots and held lease.\n'
          doc.write_text(text)
          assert set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()) == set(expected)
          subprocess.run(['git','diff','--check'], check=True)
          Path('candidate-inputs.json').write_text(json.dumps(expected, indent=2))
          PY
      - name: Qualify the exact admission implementation
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --config skip_children=true src/search_service.rs src/search_service/*.rs tests/search_service.rs
          rustfmt --edition 2024 --check --config skip_children=true src/search_service.rs src/search_service/*.rs tests/search_service.rs
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'admission-native'
          root.mkdir()
          source = Path('src/search_service/admission.rs').resolve().as_posix()
          (root / 'Cargo.toml').write_text('[package]\nname="admission-native"\nversion="0.0.0"\nedition="2024"\n[lib]\npath="lib.rs"\n')
          (root / 'lib.rs').write_text('#[allow(dead_code)]\n#[path = ' + json.dumps(source) + ']\nmod admission;\n')
          PY
          cargo test --manifest-path "$RUNNER_TEMP/admission-native/Cargo.toml" -- --test-threads=1 2>&1 | tee admission-native.log
          grep -F 'test result: ok. 6 passed; 0 failed; 1 ignored' admission-native.log
          cargo clippy --manifest-path "$RUNNER_TEMP/admission-native/Cargo.toml" --tests -- -D warnings
          git diff --check
      - name: Export qualified blobs only, never a commit or ref update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          expected = json.loads(Path('candidate-inputs.json').read_text())
          assert set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()) == set(expected)
          exported = {}
          for name in expected:
              content = Path(name).read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs',
                  data=json.dumps({'content':content.decode('utf-8'),'encoding':'utf-8'}).encode(),
                  headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'],'Content-Type':'application/json',
                           'User-Agent':'OpenAI File Downloader, XaiImageApiFetch/1.0'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == sha, name
              exported[name] = sha
          receipt = {'source_commit':os.environ['GITHUB_SHA'], 'inputs':expected, 'blobs':exported}
          Path('candidate-receipt.json').write_text(json.dumps(receipt, indent=2))
          print(json.dumps(receipt))
          subprocess.run(['tar','-czf','admission-candidate.tar.gz',*expected,'candidate-receipt.json','admission-native.log'], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: admission-candidate-${{ github.sha }}
          path: |
            admission-candidate.tar.gz
            admission-native.log
            candidate-receipt.json
          if-no-files-found: warn
          retention-days: 3
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db
      - name: Full service regressions on the qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test search_service -- --test-threads=1 --nocapture 2>&1 | tee service-candidate.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' service-candidate.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: admission-full-service-${{ github.sha }}
          path: service-candidate.log
          if-no-files-found: warn
          retention-days: 3
