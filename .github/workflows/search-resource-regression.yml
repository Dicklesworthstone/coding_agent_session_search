name: Search resource regressions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/search-resource-regression.yml
      - src/search_service/admission.rs
      - src/search_service/memory.rs
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resources:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - name: Qualify actual OS leases and resident-memory termination
        run: |
          set -euo pipefail
          git rev-parse HEAD
          rustc --version
          rustfmt --edition 2024 --check src/search_service/admission.rs src/search_service/memory.rs
          python - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'cass-resource-tests'
          root.mkdir()
          packages = tomllib.loads(Path('Cargo.lock').read_text())['package']
          sysinfo = [p for p in packages if p['name'] == 'sysinfo']
          assert len(sysinfo) == 1
          version = sysinfo[0]['version']
          (root / 'Cargo.toml').write_text('[package]\nname="cass-resource-tests"\nversion="0.0.0"\nedition="2024"\n[lib]\npath="lib.rs"\n[dependencies]\nsysinfo={version="=' + version + '",default-features=false,features=["system"]}\n')
          modules = ''.join('#[allow(dead_code)]\n#[path = ' + json.dumps(Path('src/search_service/'+name+'.rs').resolve().as_posix()) + ']\nmod '+name+';\n' for name in ['admission','memory'])
          (root / 'lib.rs').write_text(modules)
          PY
          manifest="$RUNNER_TEMP/cass-resource-tests/Cargo.toml"
          cargo test --manifest-path "$manifest" -- --test-threads=1 --nocapture 2>&1 | tee resource-tests.log
          expected=10
          if [[ "$RUNNER_OS" == Windows ]]; then expected=9; fi
          grep -F "test result: ok. $expected passed; 0 failed; 2 ignored" resource-tests.log
          cargo clippy --manifest-path "$manifest" --tests -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resource-tests-${{ matrix.os }}-${{ github.sha }}
          path: resource-tests.log
          if-no-files-found: warn
          retention-days: 7
