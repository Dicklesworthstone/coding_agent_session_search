name: Search resource memory qualification

on:
  push:
    branches: [main]
    paths: [.github/workflows/search-resource-regression.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - name: Apply the reviewed patch without changing dependency versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, copy, hashlib, json, subprocess, tomllib, zlib
          from pathlib import Path
          expected = {'src/search_service.rs':'5754fd1558397b93d147c53e0202691449cd97f8', 'src/search_service/memory.rs':None, 'tests/search_service.rs':'89a6632c518a95956804cc195b6dba34cbdc2048', 'docs/SEARCH_SERVICE.md':'5138abc95fae71565739269f7d70f91620d8557c', 'Cargo.toml':'e1fbfa58c7a7c9da4bded29a7d1e5809b476c161', 'Cargo.lock':'46e40737bf73aa8544ae2c95539e10b0098b909a'}
          guards = dict(expected, **{'src/search_service/admission.rs':'9ec0f45ff08d2658bd673a16d79ab04a4b5a9293'})
          for name, sha in guards.items():
              path = Path(name)
              if sha is None:
                  assert not path.exists(), name
              else:
                  data = path.read_bytes()
                  assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha, name
          payload = (
              ''
              ''
              ''
          )
          patch = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == 'e0ec0a2d447c512411537ec527045499c348e5dee0ba2692a90fbf3268814389'
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','-'], input=patch, check=True)
          subprocess.run(['git','apply','--reverse','--check','-'], input=patch, check=True)
          subprocess.run(['git','add','-N','src/search_service/memory.rs'], check=True)
          manifest = Path('Cargo.toml')
          text = manifest.read_text()
          assert 'sysinfo' not in tomllib.loads(text)['dependencies']
          assert text.count('[dependencies]\n') == 1
          manifest.write_text(text.replace('[dependencies]\n','[dependencies]\n# Resident-memory supervision reuses the sysinfo version already in Cargo.lock.\nsysinfo = { version = "*", default-features = false, features = ["system"] }\n',1))
          before = tomllib.loads(Path('Cargo.lock').read_text())
          sysinfo = [p for p in before['package'] if p['name'] == 'sysinfo']
          assert len(sysinfo) == 1 and sysinfo[0]['version'] == '0.39.6'
          # Cargo, not a text rewrite, updates its generated root dependency edge.
          subprocess.run(['cargo','metadata','--format-version','1'], check=True, stdout=subprocess.DEVNULL, timeout=600)
          after = tomllib.loads(Path('Cargo.lock').read_text())
          wanted = copy.deepcopy(before)
          root = next(p for p in wanted['package'] if p['name'] == 'coding-agent-search')
          assert 'sysinfo' not in root['dependencies']
          root['dependencies'] = sorted(root['dependencies'] + ['sysinfo'])
          assert after == wanted, 'refuse any dependency-version or non-root lockfile change'
          assert set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()) == set(expected)
          Path('candidate-inputs.json').write_text(json.dumps(expected, indent=2))
          subprocess.run(['git','diff','--check'], check=True)
          PY
      - name: Test real memory growth, idle sampling and kernel-lease recovery
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --config skip_children=true src/search_service.rs src/search_service/*.rs tests/search_service.rs
          rustfmt --edition 2024 --check --config skip_children=true src/search_service.rs src/search_service/*.rs tests/search_service.rs
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'cass-memory-tests'
          root.mkdir()
          (root / 'Cargo.toml').write_text('[package]\nname="cass-memory-tests"\nversion="0.0.0"\nedition="2024"\n[lib]\npath="lib.rs"\n[dependencies]\nsysinfo={version="=0.39.6",default-features=false,features=["system"]}\n')
          modules = ''.join('#[allow(dead_code)]\n#[path = ' + json.dumps(Path('src/search_service/'+name+'.rs').resolve().as_posix()) + ']\nmod '+name+';\n' for name in ['admission','memory'])
          (root / 'lib.rs').write_text(modules)
          PY
          manifest="$RUNNER_TEMP/cass-memory-tests/Cargo.toml"
          cargo test --manifest-path "$manifest" -- --test-threads=1 --nocapture 2>&1 | tee memory-native.log
          grep -F 'test result: ok. 10 passed; 0 failed; 2 ignored' memory-native.log
          cargo clippy --manifest-path "$manifest" --tests -- -D warnings
          git diff --check
      - name: Export qualified source blobs without updating any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          expected = json.loads(Path('candidate-inputs.json').read_text())
          assert set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()) == set(expected)
          exported = {}
          for name in expected:
              content = Path(name).read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs', data=json.dumps({'content':content.decode('utf-8'),'encoding':'utf-8'}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','User-Agent':'OpenAI File Downloader, XaiImageApiFetch/1.0'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == sha, name
              exported[name] = sha
          receipt = {'source_commit':os.environ['GITHUB_SHA'],'inputs':expected,'blobs':exported}
          Path('memory-receipt.json').write_text(json.dumps(receipt, indent=2))
          print(json.dumps(receipt))
          subprocess.run(['tar','-czf','memory-candidate.tar.gz',*expected,'memory-receipt.json','memory-native.log'], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-candidate-${{ github.sha }}
          path: |
            memory-candidate.tar.gz
            memory-receipt.json
            memory-native.log
          if-no-files-found: warn
          retention-days: 3
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db
      - name: Full service regressions on the memory-supervised candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test search_service -- --test-threads=1 --nocapture 2>&1 | tee memory-service.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' memory-service.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-service-${{ github.sha }}
          path: memory-service.log
          if-no-files-found: warn
          retention-days: 3
