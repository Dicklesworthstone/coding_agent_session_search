# One-shot transport for the reviewed session-scope implementation. This does
# not run the Rust gate or change release/CI policy. Exact source and patch
# identities prevent stale replays or overwriting another agent's edits.
name: Apply reviewed session-scope patch once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-session-scope-once.yml
      - scripts/patches/session-scope.patch

permissions:
  contents: write

concurrency:
  group: cass-session-scope-patch-landing
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'Dicklesworthstone/coding_agent_session_search'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify exact inputs and apply only the reviewed source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          if git('branch', '--show-current') != 'main' or git('status', '--porcelain'):
              raise SystemExit('Refusing a non-main or dirty checkout')
          expected = {
              'src/search/query.rs': '045768ee989828759e01d986637be8aeee942dc8',
              'src/search/vector_index.rs': '7ee07d9cabc40698d350decb0e16936f3b7d02c6',
              'scripts/patches/session-scope.patch': '38b37691effb5b393bfc83d68f28c5fa6f498e01',
          }
          for name, sha in expected.items():
              path = Path(name)
              if path.is_symlink() or not path.is_file() or git('hash-object', name) != sha:
                  raise SystemExit(f'Review required: source or patch changed: {name}')
          new_module = 'src/search/query/session_scope.rs'
          if os.path.lexists(new_module):
              raise SystemExit('Session-scope module already exists; refusing replacement')
          patch = 'scripts/patches/session-scope.patch'
          subprocess.run(['git', 'apply', '--check', '--whitespace=error-all', patch], check=True)
          subprocess.run(['git', 'apply', '--whitespace=error-all', patch], check=True)
          paths = ['src/search/query.rs', 'src/search/vector_index.rs', new_module]
          subprocess.run(['git', 'add', '--', *paths], check=True)
          actual = set(git('diff', '--cached', '--name-only').splitlines())
          if actual != set(paths):
              raise SystemExit(f'Unexpected staged paths: {sorted(actual)}')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          for path in paths:
              print(f'{path}: {git("hash-object", path)}')
          PY
      - name: Commit directly to main without force or a pull request
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'fix(search): enforce session membership before semantic top-k' \
              -m 'Resolve bounded session message IDs through the existing FrankenSQLite read snapshot and intersect them with metadata predicates inside exact vector selection. Skip unused ANN/two-tier allocation for scoped requests and report session_scope_requires_exact. Add nine regression tests for candidate starvation, metadata intersection, source restrictions, malformed IDs, literal paths, limits, rollback, and multi-shard merging.' \
              -m 'The one-shot GitHub transport verified complete base blob identities, applied the reviewed patch with git apply, and checked the staged diff. Rust compilation, Rust tests, Clippy, rustfmt, UBS and the normal RCH gate were not executed by this transport workflow; no runtime pass is claimed.'
          # A concurrent main update is a hard failure, never a force-push.
          GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/main
          git rev-parse HEAD
