# The session-scope implementation was landed by this recipe's predecessor.
# The writer is retired: this version only verifies an immutable revision and
# cannot commit, push, repair an archive, or change the dependency lockfile.
name: Verify landed session-scoped search

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-session-scope-once.yml

permissions:
  contents: read

concurrency:
  group: cass-session-scope-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/coding_agent_session_search'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_NET_RETRY: '1'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record exact source and compiler identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object src/search/query.rs src/search/vector_index.rs src/search/query/session_scope.rs
          rustc --version
          cargo --version
      - name: Check formatting and run nonempty scoped-search regressions
        shell: bash
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cass-session-scope-target"
          set +e
          rustfmt --edition 2024 --check src/search/query/session_scope.rs
          fmt_status=$?
          set -o pipefail
          cargo test --locked --lib search::query::session_scope::tests -- --nocapture 2>&1 | tee "$RUNNER_TEMP/session-scope-tests.log"
          test_status=${PIPESTATUS[0]}
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'session-scope-tests.log').read_text()
          counts = re.findall(r'test result: ok\. (\d+) passed; 0 failed;', text)
          if not counts or max(map(int, counts)) < 9:
              raise SystemExit('No passing receipt for all nine scoped-search regressions')
          print('Verified a nonzero passing test receipt:', counts)
          PY
          receipt_status=$?
          printf 'fmt_exit=%s test_exit=%s receipt_exit=%s\n' "$fmt_status" "$test_status" "$receipt_status"
          printf 'The full RCH/UBS/archive-scale gate is separate and was not run here.\n'
          test "$fmt_status" -eq 0 && test "$test_status" -eq 0 && test "$receipt_status" -eq 0
