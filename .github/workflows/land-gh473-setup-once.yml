name: Land GH473 parent registration retry
on:
  push:
    branches: [main]
    paths: [.github/workflows/land-gh473-setup-once.yml]
permissions:
  contents: write
concurrency:
  group: cass-gh473-setup-patch
  cancel-in-progress: false
jobs:
  land:
    if: github.repository == 'Dicklesworthstone/coding_agent_session_search'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Apply reviewed parent-registration retries
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          cp src/indexer/mod.rs "$RUNNER_TEMP/indexer-before.rs"
          grep -F 'fn with_held_writer<T>' src/indexer/gh473_tests.rs
          if grep -q 'fn warm_writer_parent_registration_retries' src/indexer/gh473_tests.rs; then
            echo 'Parent registration patch already present'
          else
            git apply --check scripts/patches/gh473-parent-registration-retry.patch
            git apply scripts/patches/gh473-parent-registration-retry.patch
          fi
          python3 - <<'PY'
          import hashlib, importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('probe', 'scripts/verify_gh473_core.py')
          probe = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          before = Path(os.environ['RUNNER_TEMP'], 'indexer-before.rs').read_text()
          after = Path('src/indexer/mod.rs').read_text()
          for name in ['index_writer_busy_timeout_ms', 'with_concurrent_retry', 'is_retryable_franken_error', 'anyhow_chain_indicates_retryable_storage_contention', 'with_ephemeral_writer']:
              old, new = probe.definition(before, name), probe.definition(after, name)
              assert old == new, 'Unexpected change to retry policy: ' + name
              print('UNCHANGED', name, hashlib.sha256(new.encode()).hexdigest())
          old = probe.definition(before, 'persist_conversations_batched_inner')
          new = probe.definition(after, 'persist_conversations_batched_inner')
          marker = '                let chunk_size = serial_batch_chunk_size()'
          assert old[old.index(marker):] == new[new.index(marker):], 'Canonical transaction/completion/publication code changed'
          assert 'retry when a warm writer encounters a new identity' in new
          PY
          rustfmt --edition 2024 src/indexer/gh473_tests.rs
          rustfmt --edition 2024 --config skip_children=true --emit stdout src/indexer/mod.rs > "$RUNNER_TEMP/indexer-parsed.rs"
          git diff --check
      - name: Commit narrowly without overwriting concurrent work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/indexer/mod.rs src/indexer/gh473_tests.rs
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m 'fix(index): retry idempotent parent registration before canonical transactions (GH473)'
            git push origin HEAD:main
          fi
          git rev-parse HEAD
      - name: State qualification scope
        if: always()
        run: echo 'Source invariance and parsing are not runtime validation. The full candidate lane separately qualifies the production persistence tests.'
