# The unstarted snapshot application was retired: this workflow never mutates
# repository source or refs. The double-copy optimization is not yet integrated.
name: Semantic recovery payload admission
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/semantic-snapshot-ownership.yml
      - src/indexer/semantic/artifacts/publication.rs
      - src/indexer/semantic/artifacts/publication/**
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run publication, ownership and repair regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/recovery-evidence/revision.txt"
          for filter in 'indexer::semantic::artifacts::publication::' 'indexer::semantic::artifacts::inspection::tests' 'indexer::semantic::artifact_lifecycle_tests'; do
            logfile="$RUNNER_TEMP/recovery-evidence/${filter//:/_}.log"
            cargo test --locked --lib "$filter" -- --nocapture --test-threads=1 2>&1 | tee "$logfile"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$logfile"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: semantic-recovery-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-evidence/
          retention-days: 7
          if-no-files-found: error
