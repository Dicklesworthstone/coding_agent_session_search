# Runtime fixes landed. This workflow cannot write repository contents or refs.
name: Verify partial index results
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shipping-cass:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: false
      - name: Test production completion, real source containment and complete CLI journeys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/commit.txt"
          cargo test --locked --lib index_result:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/evidence/completion.log"
          cargo test --locked --lib connectors::codex:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/evidence/connector.log"
          cargo test --locked --test codex_source_containment -- --nocapture 2>&1 | tee "$RUNNER_TEMP/evidence/source.log"
          cargo test --locked --test codex_source_budget_override -- --nocapture 2>&1 | tee "$RUNNER_TEMP/evidence/budget.log"
          cargo test --locked --test e2e_codex_partial_index -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/evidence/cli.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          evidence=Path(os.environ['RUNNER_TEMP'])/'evidence'
          for name,minimum in [('completion.log',9),('connector.log',24),('source.log',3),('budget.log',3),('cli.log',2)]:
              counts=re.findall(r'test result: ok\. (\d+) passed; 0 failed; 0 ignored;', (evidence/name).read_text())
              assert counts and max(map(int,counts)) >= minimum,name
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: partial-index-shipping-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
