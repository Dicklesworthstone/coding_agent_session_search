# Guarded source-only landing; no PR, force-push, dependency change, or graph rebuild.
name: Land exact recovery for sparse ANN
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-ann-underfill-once.yml]
permissions:
  contents: read
concurrency:
  group: cass-ann-underfill-landing
  cancel-in-progress: false
jobs:
  qualify-and-land:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
    defaults:
      run:
        shell: bash
        working-directory: cass-source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: cass-source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dicklesworthstone/frankensearch
          ref: 6852e79a830c402ea4e55eb79eda3373c618dfc3
          path: fs-source
          persist-credentials: false
      - name: Apply only the reviewed patch to matching source blobs
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/ann-recovery-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/ann-recovery-evidence/parent.txt"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
              'src/search/query.rs': 'c42377d654a7b7ad9a3b0134e53f543424f59314',
              'src/search/query/ann_shards.rs': 'b8f1bb9c81d6174cf38bfd61f8fd6c7600070ff5',
              'src/search/ann_index.rs': '9565940c76e0e3d62735357b401c5cc9ab024fa7',
              'scripts/verify_ann_shards.py': '05ebba3de0c8f3147fd4b8c960c09acf23f8a959',
              'scripts/patches/ann-underfill.patch': 'b02a2571618af3ef9ad4b2ab35941ca27349ad9f',
          }
          for path, expected_hash in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if Path(path).is_symlink() or actual != expected_hash:
                  raise SystemExit('Changed source requires review: ' + path)
          PY
          git apply --check --whitespace=error-all scripts/patches/ann-underfill.patch
          git apply --whitespace=error-all scripts/patches/ann-underfill.patch
          rustfmt --edition 2024 src/search/ann_index.rs src/search/query/ann_shards.rs
          rustfmt --edition 2024 --config skip_children=true --emit stdout src/search/query.rs > "$RUNNER_TEMP/query-parsed.rs"
          git diff --check
      - name: Compile and execute all 41 production component regressions
        run: |
          set -euo pipefail
          rustc --version | tee "$RUNNER_TEMP/ann-recovery-evidence/toolchain.txt"
          python3 scripts/verify_ann_shards.py "$PWD" "$GITHUB_WORKSPACE/fs-source" "$RUNNER_TEMP/ann-recovery-check" | tee "$RUNNER_TEMP/ann-recovery-evidence/source-receipt.txt"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/ann-recovery-target"
          cd "$RUNNER_TEMP/ann-recovery-check"
          cargo generate-lockfile
          cp Cargo.lock "$RUNNER_TEMP/ann-recovery-evidence/component-Cargo.lock"
          cargo test --locked -- --nocapture --test-threads=2 2>&1 | tee "$RUNNER_TEMP/ann-recovery-evidence/tests.log"
          grep -Eq 'test result: ok\. 41 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/ann-recovery-evidence/tests.log"
      - name: Record component Clippy separately from full CASS qualification
        id: lint
        run: |
          set -uo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/ann-recovery-target"
          cd "$RUNNER_TEMP/ann-recovery-check"
          set +e
          cargo clippy --locked --lib --tests -- -D warnings > "$RUNNER_TEMP/ann-recovery-evidence/clippy.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/ann-recovery-evidence/clippy.log"
          echo "status=$result" >> "$GITHUB_OUTPUT"
          printf 'COMPONENT_CLIPPY_EXIT=%s\n' "$result"
      - name: Commit the tested source-only changes directly to main
        env:
          COMPONENT_CLIPPY_EXIT: ${{ steps.lint.outputs.status }}
        run: |
          set -euo pipefail
          git add -- src/search/query.rs src/search/query/ann_shards.rs src/search/ann_index.rs scripts/verify_ann_shards.py
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          expected = {'src/search/query.rs', 'src/search/query/ann_shards.rs', 'src/search/ann_index.rs', 'scripts/verify_ann_shards.py'}
          if changed != expected:
              raise SystemExit('Unexpected staged paths: ' + repr(changed))
          PY
          git diff --cached --check
          git hash-object src/search/query.rs src/search/query/ann_shards.rs src/search/ann_index.rs scripts/verify_ann_shards.py | tee "$RUNNER_TEMP/ann-recovery-evidence/blobs.txt"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit \
            -m 'fix(search): recover filtered and chunk-starved ANN pages through exact retrieval' \
            -m 'When a valid native cohort underfills its message page with unsearched candidates remaining, execute the existing bounded exact driver over every retained shard with the same filter. Replace rather than mix native/exact scores, preserve native work counters, and emit a typed exact-fallback receipt. Preserve full native pages, exhausted scopes, zero requests, invalid-owner rejection, and read-only artifact ownership.' \
            -m "Executed 41 production-component tests against real pinned FSVI/HNSW, including six new recovery regressions and complete production receipt serialization. Component Clippy exit=$COMPONENT_CLIPPY_EXIT. This separate dependency graph does not qualify the full CASS binary; its locked build remains independently blocked by frankensearch =0.6.1 publication. No model/CLI/RCH or archive-scale pass is claimed."
          for attempt in 1 2 3; do
            if GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/main; then
              git rev-parse HEAD | tee "$RUNNER_TEMP/ann-recovery-evidence/commit.txt"
              tar -czf "$RUNNER_TEMP/ann-recovery-evidence/tested-source.tar.gz" src/search/query.rs src/search/query/ann_shards.rs src/search/ann_index.rs scripts/verify_ann_shards.py
              exit 0
            fi
            parent=$(git rev-parse HEAD^)
            git fetch --depth=100 origin main
            test -z "$(git diff --name-only "$parent" FETCH_HEAD -- src/search scripts/verify_ann_shards.py scripts/verify_message_topk_fsvi.py Cargo.toml Cargo.lock rust-toolchain.toml)"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' rebase FETCH_HEAD
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ann-recovery-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/ann-recovery-evidence/
          if-no-files-found: error
          retention-days: 14
