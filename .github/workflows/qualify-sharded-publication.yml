name: Land qualified sharded publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/qualify-sharded-publication.yml]
permissions:
  contents: read
concurrency:
  group: cass-sharded-publication-landing
  cancel-in-progress: false
jobs:
  land-tested-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Reuse only the exact immutable source that passed all 140 component tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/landing-evidence"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10567499466/zip" > "$RUNNER_TEMP/qualified.zip"
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          archive = Path(os.environ['RUNNER_TEMP']) / 'qualified.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'f2feba4ae1d2c96ca8addace054f9279abd36cb8391d531bb01a569e2a9e2966'
          z = zipfile.ZipFile(archive)
          assert z.read('base.txt').decode().strip() == 'cac29f8a1bb7f515dcd7c4dd97068813930e8230'
          assert 'test result: ok. 140 passed; 0 failed; 0 ignored;' in z.read('tests.log').decode()
          assert 'test result: ok. 14 passed; 0 failed; 0 ignored;' in z.read('new-tests.log').decode()
          assert 'failed to select a version for the requirement `frankensearch = "=0.6.1"`' in z.read('locked-cass.log').decode()
          expected = {
              'src/search/semantic_manifest.rs': ('45e12506457d0b9823d25fd65e08a9a7a3cc83a0', 'fa8e9b01b7e2dd6fa005c1e4ef1725e88e427d5e'),
              'src/search/semantic_manifest/shards.rs': (None, '77717470595071c9db20690624a77d3ff3dd9371'),
              'src/search/semantic_reader/publication.rs': ('8b5f6cbbb48decf1e30e5450bd936a3252983243', 'b39fc380066cc22c64ac7a98aec495265c7127f5'),
              'src/search/semantic_reader/ann.rs': ('404b7025c7c09bc977292715f23c287e3060a8fd', 'b5d9f79a1651ea0c03e3228ea195fe911304b7c8'),
              'src/search/semantic_reader/publication/tests.rs': ('6a5c8b816c45752e57818661d01c31529a6fbaa5', 'b1c067fd1400f388002acf74ad8da12996c71885'),
              'src/search/semantic_reader/publication/tests/sharded.rs': (None, 'eb7faaf794fa6669d125e8329c6ac58e38036c6f'),
              'tests/semantic_generation_manifest.rs': ('275709bdfe1df49f4196e5b5490e46b5648cc2d9', '0f6e85cff06cba57da9c3bdebb8e1f5821a94308'),
              'scripts/verify_sharded_publication.py': (None, '9f83ca7ce9a71c439ced830ab38b58c9782dda30'),
              'src/search/semantic_reader/publication/live_docset.rs': (None, '8a53b0e7e3613aab4b385099cb8f40d6dcacfe74'),
          }
          for name, (before, after) in expected.items():
              path = Path(name)
              assert not path.is_symlink(), name
              assert (not path.exists()) if before is None else blob(path.read_bytes()) == before, name
              assert blob(z.read('source/' + name)) == after, name
          for name in expected:
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(z.read('source/' + name))
          evidence = Path(os.environ['RUNNER_TEMP']) / 'landing-evidence'
          for name in ['tests.log', 'new-tests.log', 'locked-cass.log', 'component-Cargo.lock', 'source-receipt.json', 'selected-beads.json']:
              (evidence / name).write_bytes(z.read(name))
          (evidence / 'source-blobs.json').write_text(json.dumps(expected, indent=2))
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert changed | untracked == set(expected)
          subprocess.run(['git', 'add', '--', *expected], check=True)
          PY
          git diff --cached --check
      - name: Record the shipping dependency failure separately without losing its exit code
        shell: bash
        run: |
          set -euo pipefail
          code=0
          timeout 120 cargo test --locked --lib search::semantic_reader::publication::tests::sharded -- --nocapture > "$RUNNER_TEMP/landing-evidence/locked-cass-retry.log" 2>&1 || code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/landing-evidence/locked-cass-exit.txt"
          cat "$RUNNER_TEMP/landing-evidence/locked-cass-retry.log"
          git diff --exit-code -- Cargo.toml Cargo.lock build.rs
          git diff --cached --exit-code -- Cargo.toml Cargo.lock build.rs
      - name: Commit the qualified implementation directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(search): publish and retain complete ordered semantic shard cohorts' -m 'Add explicit version-2 partition metadata while preserving v1 JSON and digest behavior. Validate complete bounded lexical partitions and exact ordinal-specific ANN bases; admit every selected shard with immutable owner and checked live-row extrema. Reconstruct whole-corpus commitments by a bounded-head merge in native FSVI hash order, including multi-row and tombstoned images. Keep partial quality coverage explicit and missing graph receipts on exact fallback. All 140 component tests passed against pinned real upstream code in run 35396526034, including 14 new real-file regressions; all committed bytes match its immutable artifact. This separate dependency graph does not qualify the shipping CASS binary or enable its progressive CLI route. Shipping frankensearch =0.6.1 remains unpublished. No repository dependency pins, lockfile, models or user archives changed.'
          git push origin HEAD:main
          git rev-parse HEAD | tee "$RUNNER_TEMP/landing-evidence/runtime-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sharded-publication-landing-${{ github.sha }}
          path: ${{ runner.temp }}/landing-evidence/
          retention-days: 14
