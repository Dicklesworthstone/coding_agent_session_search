name: Ingest source qualification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ingest-source-qualification.yml]
permissions:
  contents: read
concurrency:
  group: cass-ingest-source-qualification
  cancel-in-progress: false
jobs:
  land:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Apply the reviewed GH482 patch with exact context
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if git apply --reverse --check scripts/patches/gh482-session-ann-warning.patch 2>/dev/null; then
            echo 'GH482 patch already present'
          else
            git apply --check scripts/patches/gh482-session-ann-warning.patch
            git apply scripts/patches/gh482-session-ann-warning.patch
          fi
      - name: Compile the actual enum and warning functions and run their tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          vector = Path('src/search/vector_index.rs').read_text()
          start = vector.index('pub enum SemanticAnnUnavailableReason {')
          end = vector.index('/// One opened semantic index', start)
          # Serde derives are serialization-only; the exact enum, code() and
          # warning/test bodies are compiled below without the full dependency graph.
          enum = '#[derive(Debug, Clone, Copy, PartialEq, Eq)]\n' + vector[start:end]
          lib = Path('src/lib.rs').read_text()
          start = lib.index('fn ann_fallback_human_warning(')
          end = lib.index('fn toon_encode_options_from_env()', start)
          program = 'mod search { pub mod vector_index {\n' + enum + '\n}}\n' + lib[start:end]
          Path(os.environ['RUNNER_TEMP'], 'gh482.rs').write_text(program)
          PY
          rustc --edition 2024 --test "$RUNNER_TEMP/gh482.rs" -o "$RUNNER_TEMP/gh482"
          "$RUNNER_TEMP/gh482" --nocapture | tee "$RUNNER_TEMP/gh482.log"
          grep -F '3 passed; 0 failed' "$RUNNER_TEMP/gh482.log"
          git diff --check
      - name: Commit only the reviewed production fix and its bead
        id: commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('.beads/issues.jsonl')
          entries = [json.loads(line) for line in path.read_text().splitlines() if line]
          bead_id = 'coding_agent_session_search-gh482-ann-warning'
          if not any(entry['id'] == bead_id for entry in entries):
              now = datetime.now(timezone.utc).isoformat()
              bead = {'id': bead_id, 'title': 'gh482 handle intentional session-scoped exact ANN fallback in CLI diagnostics', 'description': 'GH482 reports E0004 on 89b68592 and 30ac51c7: SessionScopeRequiresExact was added without the CLI warning match arm. Add explicit non-repair guidance while retaining the session filter, extend all-reasons coverage, and qualify the full CASS candidate graph separately from unpublished registry dependency status.', 'status': 'in_progress', 'priority': 0, 'issue_type': 'bug', 'created_at': now, 'updated_at': now, 'created_by': 'github-actions', 'source_repo': '.'}
              with path.open('a') as file:
                  file.write(json.dumps(bead, separators=(',', ':')) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/lib.rs .beads/issues.jsonl
          if ! git diff --cached --quiet; then
            git commit -m 'fix(search): handle intentional session-scoped ANN fallback (GH482)'
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  candidate-runtime:
    name: Full CASS with pinned unpublished search candidate (not registry release proof)
    needs: land
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.land.outputs.revision }}
          persist-credentials: false
      - name: Prepare an isolated, exact-revision search candidate overlay
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cp Cargo.lock "$RUNNER_TEMP/Cargo.registry.lock"
          git init "$RUNNER_TEMP/frankensearch"
          git -C "$RUNNER_TEMP/frankensearch" remote add origin https://github.com/Dicklesworthstone/frankensearch
          git -C "$RUNNER_TEMP/frankensearch" fetch --depth=1 origin 2de4b7f529670c9aad1a676f9641210276aff1fb
          git -C "$RUNNER_TEMP/frankensearch" checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          package = tomllib.loads((root / 'frankensearch/frankensearch/Cargo.toml').read_text())['package']
          assert package['version'] == '0.6.1'
          config = '[patch.crates-io]\nfrankensearch = { path = ' + repr(str(root / 'frankensearch/frankensearch')) + ' }\n'
          (root / 'candidate.toml').write_text(config)
          PY
          cargo --config "$RUNNER_TEMP/candidate.toml" generate-lockfile
          cp Cargo.lock "$RUNNER_TEMP/Cargo.candidate.lock"
          sha256sum Cargo.lock
          git diff --exit-code -- Cargo.toml src
      - name: Run full CASS GH473 persistence regressions
        run: |
          set -euo pipefail
          timeout 1800s cargo --config "$RUNNER_TEMP/candidate.toml" test --locked --lib gh473 -- --nocapture 2>&1 | tee "$RUNNER_TEMP/gh473-full-cass.log"
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/gh473-full-cass.log"
      - name: Run source-completion atomicity and CLI fallback regressions
        run: |
          set -euo pipefail
          for test in gh426_source_completion ann_fallback_human_warning_tests; do
            timeout 300s cargo --config "$RUNNER_TEMP/candidate.toml" test --locked --lib "$test" -- --nocapture 2>&1 | tee "$RUNNER_TEMP/$test.log"
            grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/$test.log"
          done
      - name: Archive exact graph and runtime results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cass-candidate-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/Cargo.*.lock
            ${{ runner.temp }}/gh473-full-cass.log
            ${{ runner.temp }}/gh426_source_completion.log
            ${{ runner.temp }}/ann_fallback_human_warning_tests.log
          retention-days: 7
          if-no-files-found: warn
      - name: State evidence scope
        if: always()
        run: |
          echo 'This lane uses full committed CASS source and a pinned same-version source overlay for unpublished frankensearch 0.6.1.'
          echo 'It does not qualify the root registry lockfile, a release binary, or the original user archive.'
