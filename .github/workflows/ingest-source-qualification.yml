name: Ingest source qualification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ingest-source-qualification.yml]
permissions:
  contents: read
concurrency:
  group: cass-ingest-source-qualification
  cancel-in-progress: false
jobs:
  land:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Apply reviewed parent-registration retries after writer-setup hardening
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          cp src/indexer/mod.rs "$RUNNER_TEMP/indexer-before.rs"
          grep -F 'fn with_held_writer<T>' src/indexer/gh473_tests.rs
          if grep -q 'fn warm_writer_parent_registration_retries' src/indexer/gh473_tests.rs; then
            echo 'Parent registration patch already present'
          else
            git apply --check scripts/patches/gh473-parent-registration-retry.patch
            git apply scripts/patches/gh473-parent-registration-retry.patch
          fi
          python3 - <<'PY'
          import hashlib, importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('probe', 'scripts/verify_gh473_core.py')
          probe = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          before = Path(os.environ['RUNNER_TEMP'], 'indexer-before.rs').read_text()
          after = Path('src/indexer/mod.rs').read_text()
          for name in ['index_writer_busy_timeout_ms', 'with_concurrent_retry', 'is_retryable_franken_error', 'anyhow_chain_indicates_retryable_storage_contention', 'with_ephemeral_writer']:
              old, new = probe.definition(before, name), probe.definition(after, name)
              assert old == new, 'Unexpected change to retry policy: ' + name
              print('UNCHANGED', name, hashlib.sha256(new.encode()).hexdigest())
          name = 'persist_conversations_batched_inner'
          old, new = probe.definition(before, name), probe.definition(after, name)
          marker = '                let chunk_size = serial_batch_chunk_size()'
          assert old[old.index(marker):] == new[new.index(marker):], 'Canonical transaction/completion/publication code changed'
          assert 'retry when a warm writer encounters a new identity' in new
          PY
          rustfmt --edition 2024 src/indexer/gh473_tests.rs
          rustfmt --edition 2024 --config skip_children=true --emit stdout src/indexer/mod.rs > "$RUNNER_TEMP/indexer-parsed.rs"
          git diff --check
      - name: Commit only production registration retries and their regressions
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/indexer/mod.rs src/indexer/gh473_tests.rs
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m 'fix(index): retry idempotent parent registration before canonical transactions (GH473)'
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  candidate-runtime:
    name: Full CASS with pinned unpublished search candidate (not registry release proof)
    needs: land
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.land.outputs.revision }}
          persist-credentials: false
      - name: Prepare an isolated exact-revision same-version search candidate
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/cass-revision.txt"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.registry.lock"
          git init "$RUNNER_TEMP/frankensearch"
          git -C "$RUNNER_TEMP/frankensearch" remote add origin https://github.com/Dicklesworthstone/frankensearch
          git -C "$RUNNER_TEMP/frankensearch" fetch --depth=1 origin 2de4b7f529670c9aad1a676f9641210276aff1fb
          git -C "$RUNNER_TEMP/frankensearch" checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          package = tomllib.loads((root / 'frankensearch/frankensearch/Cargo.toml').read_text())['package']
          assert package['version'] == '0.6.1'
          config = '[patch.crates-io]\nfrankensearch = { path = ' + repr(str(root / 'frankensearch/frankensearch')) + ' }\n'
          (root / 'candidate.toml').write_text(config)
          PY
          cargo --config "$RUNNER_TEMP/candidate.toml" generate-lockfile
          cp Cargo.lock "$RUNNER_TEMP/Cargo.candidate.lock"
          sha256sum Cargo.lock
          git diff --exit-code -- Cargo.toml src
      - name: Build the full CASS library test target
        id: build
        run: |
          set -euo pipefail
          timeout 2100s cargo --config "$RUNNER_TEMP/candidate.toml" test --locked --lib --no-run 2>&1 | tee "$RUNNER_TEMP/cass-build.log"
      - name: Run production ingest, atomic completion, and CLI fallback suites
        if: steps.build.outcome == 'success'
        run: |
          set -uo pipefail
          failed=0
          for test in gh473 gh426_source_completion ann_fallback_human_warning_tests; do
            timeout 360s cargo --config "$RUNNER_TEMP/candidate.toml" test --locked --lib "$test" -- --nocapture 2>&1 | tee "$RUNNER_TEMP/$test.log"
            result=$?
            if test "$result" -ne 0 || ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/$test.log"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Archive exact graph and observed results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cass-candidate-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/Cargo.*.lock
            ${{ runner.temp }}/cass-revision.txt
            ${{ runner.temp }}/cass-build.log
            ${{ runner.temp }}/gh473.log
            ${{ runner.temp }}/gh426_source_completion.log
            ${{ runner.temp }}/ann_fallback_human_warning_tests.log
          retention-days: 7
          if-no-files-found: warn
      - name: State evidence scope
        if: always()
        run: |
          echo 'Full committed CASS source; pinned same-version source overlay for unpublished frankensearch 0.6.1.'
          echo 'This does not qualify the root registry lockfile, a release binary, or the original user archive.'
