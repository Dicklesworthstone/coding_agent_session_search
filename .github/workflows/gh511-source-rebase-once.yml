name: GH511 exact metadata rebase

on:
  workflow_run:
    workflows: ['Source ledger contract']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebase:
    # The existing source-ledger export failed before compiling any code.
    # Its one explicit retry provides a dispatch signal only. Never consume
    # artifacts or executable code from the triggering workflow.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.id == 37715989766 &&
       github.event.workflow_run.run_attempt == 2 &&
       github.event.workflow_run.head_sha == '50aba8aa5c70f0bd15276065e230bd266ea6985b' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # workflow_run uses the current default-branch SHA, not the old
          # triggering run's checkout. The helper checks both monolith hashes.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read repository toolchain
        id: toolchain
        shell: bash
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          channel = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'channel={channel}\n')
          PY
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - name: Merge exact native-qualified sources and upload immutable objects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          sha = 'ef932a6d7ec10d939b5a996ad9669b545db07581'
          request = urllib.request.Request(
              'https://api.github.com/repos/Dicklesworthstone/coding_agent_session_search/git/blobs/' + sha,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=120) as response:
              data = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
          exec(compile(data, 'reviewed-metadata-preparer.py', 'exec'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gh511-metadata-rebase-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ingest-metadata-source/
          if-no-files-found: error
          retention-days: 7
