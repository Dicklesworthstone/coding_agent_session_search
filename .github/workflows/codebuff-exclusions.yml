name: Codebuff exclusion admission

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codebuff-exclusions.yml
      - .cargo/config.toml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - build.rs
      - src/connectors/**
      - src/connector_ingest_diagnostics.rs
      - src/indexer/**
      - tests/codebuff_exclusions.rs
      - tests/codebuff_source_reuse.rs
      - tests/codebuff_timestamp_contract.rs
      - tests/e2e_multi_connector.rs
      - scripts/check_dependency_features.py
      - scripts/gate.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Codebuff admission (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-slim]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 110 || 15 }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
      RUSTFLAGS: '-Zthreads=1'
      RUST_BACKTRACE: '1'
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read repository toolchain and record the source
        id: toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codebuff-admission"
          git rev-parse HEAD | tee "$RUNNER_TEMP/codebuff-admission/revision.txt"
          cp Cargo.lock "$RUNNER_TEMP/codebuff-admission/Cargo.lock"
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          channel = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'channel={channel}\n')
          PY
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db
        if: matrix.os == 'windows-2025'
        with:
          key: codebuff-admission-windows
          cache-on-failure: true
      - name: Check committed source and run native CASS gates
        # Watch routing is committed. Test that checkout without a candidate
        # patch, source rewriting, API object uploads, or write permissions.
        # The slim runner checks formatting only, never native functionality.
        timeout-minutes: ${{ matrix.os == 'windows-2025' && 95 || 10 }}
        env:
          RUN_NATIVE: ${{ matrix.os == 'windows-2025' && '1' || '0' }}
        run: |
          set +e
          set -uo pipefail
          evidence="$RUNNER_TEMP/codebuff-admission"
          failed=0
          cargo_cmd=(cargo
            --config 'profile.dev.package.asupersync.codegen-units=256'
            --config 'profile.dev.package.asupersync.opt-level=0')
          run_gate() {
            local stage="$1" kind="$2" rc counts
            shift 2
            { printf 'STAGE=%s COMMAND=' "$stage"; printf ' %q' "$@"; printf '\n'; } | tee -a "$evidence/receipt.log" || failed=1
            "$@" 2>&1 | tee "$evidence/$stage.log"
            local statuses=("${PIPESTATUS[@]}")
            rc=${statuses[0]}
            [ "${statuses[1]}" -eq 0 ] || rc=1
            if [ "$kind" = test ] && [ "$rc" -eq 0 ]; then
              if counts="$(bash scripts/gate.sh --verify-test-log "$evidence/$stage.log")"; then
                printf 'TEST_COUNT=%s %s\n' "$stage" "$counts" | tee -a "$evidence/receipt.log" || failed=1
              else
                rc=1
              fi
            fi
            printf 'STAGE=%s EXIT=%s\n' "$stage" "$rc" | tee -a "$evidence/receipt.log" || failed=1
            [ "$rc" -eq 0 ] || failed=1
          }
          run_gate compiler command rustc --version --verbose
          run_gate dependency-features command python scripts/check_dependency_features.py
          run_gate fmt command rustfmt --edition 2024 --check --config skip_children=true \
            src/connectors/mod.rs src/connectors/codebuff.rs src/connectors/source_dependencies.rs \
            src/indexer/mod.rs tests/codebuff_exclusions.rs tests/codebuff_source_reuse.rs
          if [ "$RUN_NATIVE" = 1 ]; then
            run_gate exclusions test "${cargo_cmd[@]}" test --locked --test codebuff_exclusions -- --nocapture --test-threads=1
            run_gate source-reuse test "${cargo_cmd[@]}" test --locked --test codebuff_source_reuse -- --nocapture --test-threads=1
            run_gate gh511 test "${cargo_cmd[@]}" test --locked --test e2e_multi_connector gh511_ -- --nocapture --test-threads=1
            run_gate timestamp-contract test "${cargo_cmd[@]}" test --locked --test codebuff_timestamp_contract -- --nocapture --test-threads=1
            run_gate boundaries test "${cargo_cmd[@]}" test --locked --lib connectors::codebuff:: -- --nocapture --test-threads=1
            run_gate source-capabilities test "${cargo_cmd[@]}" test --locked --lib connectors::source_dependencies::tests -- --nocapture --test-threads=1
            run_gate diagnostics test "${cargo_cmd[@]}" test --locked --lib connector_ingest_diagnostics::tests -- --nocapture --test-threads=1
            run_gate dependency-drift test "${cargo_cmd[@]}" test --locked --lib dependency_drift::tests -- --nocapture --test-threads=1
            run_gate clippy command "${cargo_cmd[@]}" clippy --locked --lib --bin cass \
              --test codebuff_exclusions --test codebuff_source_reuse --test codebuff_timestamp_contract \
              --test e2e_multi_connector -- -D warnings
          fi
          run_gate source-unchanged command git diff --exit-code
          printf 'STAGE=job-complete EXIT=%s\n' "$failed" | tee -a "$evidence/receipt.log" || failed=1
          exit "$failed"
      - name: Retain native receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codebuff-admission-receipts-${{ github.sha }}-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codebuff-admission/
          if-no-files-found: error
          retention-days: 7
