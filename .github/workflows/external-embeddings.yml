name: External embedding contract
permissions:
  contents: read
jobs:
  source-export:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
      with:
        toolchain: nightly-2026-08-31
        components: rustfmt
    - name: Export exact reconciled producer continuity sources without ref writes
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'PY'
        import base64, hashlib, json, os, urllib.request
        sha = '60fb20aa623f0c95073cac488672fd8a5e38c349'
        url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha
        request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
        with urllib.request.urlopen(request, timeout=60) as response:
            value = json.load(response)
        assert value['encoding'] == 'base64'
        source = base64.b64decode(value['content'])
        assert hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest() == sha
        exec(compile(source, 'reviewed-probe-export', 'exec'))
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: external-probe-source-${{ github.sha }}
        path: external-probe-source.tar.gz
        if-no-files-found: error
        retention-days: 7
  native:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Verify the committed source revision
      run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: external-probe-source-ubuntu-${{ github.sha }}
    - name: Verify and install exact producer continuity candidate
      run: |
        python3 - <<'PY'
        import hashlib, json, tarfile
        from pathlib import Path
        with tarfile.open('external-probe-source.tar.gz', 'r:gz') as archive:
            receipt = json.load(archive.extractfile('external-probe-source-receipt.json'))
            def digest(data):
                return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
            assert set(receipt['bases']) == set(receipt['blobs'])
            for name, expected in receipt['blobs'].items():
                path = Path(name)
                assert not path.is_absolute() and '..' not in path.parts
                assert not any(p.is_symlink() for p in [path, *path.parents])
                assert (digest(path.read_bytes()) if path.exists() else None) == receipt['bases'][name]
                member = archive.getmember(name)
                assert member.isfile()
                data = archive.extractfile(member).read()
                assert digest(data) == expected
                path.parent.mkdir(parents=True, exist_ok=True)
                path.write_bytes(data)
        PY
    - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
      with:
        toolchain: nightly-2026-08-31
        components: clippy, rustfmt
    - name: External provider fake-server regressions
      run: cargo test --locked --lib search::external_embedder::tests -- --nocapture
    - name: Persisted external producer admission regressions
      run: cargo test --locked --lib search::external_embedder::evidence::tests -- --nocapture
    - name: Provider selection and retained local registry regressions
      run: cargo test --locked --lib search::embedder_registry -- --nocapture
    - name: External canonical backfill, query and signal regressions
      run: cargo test --locked --test external_backfill_runtime -- --nocapture
    - name: External query admission and zero-HTTP refusal regressions
      run: cargo test --locked --lib search::model_manager::external::tests -- --nocapture
    - name: External diagnostic cause and typed-error preservation
      run: cargo test --locked --lib indexer::semantic::external_diagnostic_tests -- --nocapture
    - name: Scheduler regression tests
      run: cargo test --locked --lib schedule::tests -- --nocapture
    - name: Existing local backfill CLI regressions
      run: cargo test --locked --test e2e_semantic_backfill_robot -- --nocapture
    - name: Semantic engine and artifact ownership regressions
      run: 'cargo test --locked --lib indexer::semantic:: -- --nocapture'
    - name: External provider and CLI formatting
      if: always()
      run: rustfmt --edition 2024 --check --config skip_children=true src/search/external_embedder.rs src/search/external_embedder/evidence.rs src/search/external_embedder/retry.rs src/search/external_embedder/tests.rs
        src/search/external_embedder/tests/admission.rs src/search/external_embedder/tests/retries.rs src/search/embedder_registry.rs src/indexer/semantic.rs src/indexer/semantic/engine.rs src/indexer/semantic/delegate.rs
        src/indexer/semantic/shard_publication_tests.rs src/indexer/semantic/unchanged.rs src/indexer/semantic/unchanged/cancellation_tests.rs src/search/model_manager.rs src/search/model_manager/external.rs
        src/search/model_manager/external/tests.rs src/search/model_manager/external/tests/probe_binding.rs tests/external_backfill_runtime.rs tests/external_backfill_runtime/cli.rs src/lib.rs src/indexer/mod.rs
        src/schedule.rs
    needs: source-export-ubuntu
  source-export-ubuntu:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
      with:
        toolchain: nightly-2026-08-31
        components: rustfmt
    - name: Export exact reconciled producer continuity sources without ref writes
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'PY'
        import base64, hashlib, json, os, urllib.request
        sha = '60fb20aa623f0c95073cac488672fd8a5e38c349'
        url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha
        request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
        with urllib.request.urlopen(request, timeout=60) as response:
            value = json.load(response)
        assert value['encoding'] == 'base64'
        source = base64.b64decode(value['content'])
        assert hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest() == sha
        exec(compile(source, 'reviewed-probe-export', 'exec'))
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: external-probe-source-ubuntu-${{ github.sha }}
        path: external-probe-source.tar.gz
        if-no-files-found: error
        retention-days: 7
  committed-query:
    # Qualify the actual checkout independently of the separate, uncommitted
    # producer-continuity candidate. Neither job replaces the other's gates.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Verify the committed source revision
      run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
      with:
        toolchain: nightly-2026-08-31
        components: clippy, rustfmt
    - name: Committed external query admission and preflight races
      run: cargo test --locked --lib search::model_manager::external::tests -- --nocapture
    - name: Committed provider, bounded retries and cancellation
      run: cargo test --locked --lib search::external_embedder::tests -- --nocapture
    - name: Committed library Clippy
      run: cargo clippy --locked --lib -- -D warnings
    - name: Changed query source formatting
      if: always()
      run: >-
        rustfmt --edition 2024 --check --config skip_children=true
        src/search/model_manager/external.rs
        src/search/model_manager/external/tests.rs
        src/search/model_manager/external/tests/admission_races.rs
    - name: Verify validation did not alter committed sources
      if: always()
      run: git diff --exit-code HEAD -- src tests Cargo.toml Cargo.lock build.rs rust-toolchain.toml .cargo
'on':
  push:
    branches:
    - main
    paths:
    - src/search/external_embedder.rs
    - src/search/external_embedder/**
    - src/search/embedder_registry.rs
    - src/search/embedder_registry/**
    - src/search/model_manager.rs
    - src/search/model_manager/**
    - src/indexer/semantic.rs
    - src/indexer/semantic/**
    - src/indexer/mod.rs
    - src/lib.rs
    - src/schedule.rs
    - tests/external_backfill_runtime.rs
    - tests/external_backfill_runtime/**
    - tests/e2e_external_embeddings.rs
    - .github/workflows/external-embeddings.yml
  workflow_dispatch: null
