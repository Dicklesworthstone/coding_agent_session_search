name: External embedding contract
on:
  push:
    branches: [main]
    paths:
      - src/search/external_embedder.rs
      - src/search/external_embedder/**
      - src/search/embedder_registry.rs
      - src/search/embedder_registry/**
      - src/search/model_manager.rs
      - src/search/model_manager/**
      - src/indexer/semantic.rs
      - src/indexer/semantic/**
      - src/indexer/mod.rs
      - src/lib.rs
      - src/schedule.rs
      - tests/external_backfill_runtime.rs
      - tests/external_backfill_runtime/**
      - tests/e2e_external_embeddings.rs
      - .github/workflows/external-embeddings.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the committed source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: nightly-2026-08-31
          components: clippy, rustfmt
      - name: External provider fake-server regressions
        run: cargo test --locked --lib search::external_embedder::tests -- --nocapture
      - name: Provider selection and retained local registry regressions
        run: cargo test --locked --lib search::embedder_registry -- --nocapture
      - name: External canonical backfill, query and signal regressions
        run: cargo test --locked --test external_backfill_runtime -- --nocapture
      - name: External query admission and zero-HTTP refusal regressions
        run: cargo test --locked --lib search::model_manager::external::tests -- --nocapture
      - name: External diagnostic cause and typed-error preservation
        run: cargo test --locked --lib indexer::semantic::external_diagnostic_tests -- --nocapture
      - name: Scheduler regression tests
        run: cargo test --locked --lib schedule::tests -- --nocapture
      - name: Existing local backfill CLI regressions
        run: cargo test --locked --test e2e_semantic_backfill_robot -- --nocapture
      - name: Semantic engine and artifact ownership regressions
        run: cargo test --locked --lib indexer::semantic:: -- --nocapture
      - name: External provider and CLI formatting
        if: always()
        run: rustfmt --edition 2024 --check --config skip_children=true src/search/external_embedder.rs src/search/external_embedder/tests.rs src/search/embedder_registry.rs src/indexer/semantic.rs src/indexer/semantic/engine.rs src/indexer/semantic/shard_publication_tests.rs src/search/model_manager.rs src/search/model_manager/external.rs src/search/model_manager/external/tests.rs tests/external_backfill_runtime.rs tests/external_backfill_runtime/cli.rs src/lib.rs src/indexer/mod.rs src/schedule.rs
      - name: Verify validation did not alter the committed sources
        if: always()
        run: git diff --exit-code HEAD -- src tests Cargo.toml Cargo.lock build.rs rust-toolchain.toml .cargo
