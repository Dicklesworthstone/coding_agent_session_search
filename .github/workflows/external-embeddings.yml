name: External embedding contract
on:
  push:
    branches: [main]
    paths:
      - src/search/external_embedder.rs
      - src/search/external_embedder/**
      - src/search/embedder_registry.rs
      - src/search/embedder_registry/**
      - src/search/model_manager.rs
      - src/indexer/semantic/**
      - src/lib.rs
      - tests/external_embeddings.rs
      - .github/workflows/external-embeddings.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture exact sources without running repository code
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          files = ['src/search/external_embedder.rs', 'src/search/external_embedder/tests.rs', 'src/search/embedder_registry.rs', 'src/search/embedder_registry/local.rs', 'src/search/model_manager.rs', 'src/indexer/semantic.rs', 'src/indexer/semantic/engine.rs', 'src/lib.rs']
          def digest(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          receipt = {'source_commit': os.environ['GITHUB_SHA'], 'blobs': {name: digest(Path(name).read_bytes()) for name in files}}
          Path('external-source-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          beads = []
          for line in Path('.beads/issues.jsonl').read_text().splitlines():
              if 'coding_agent_session_search-gl29d' in line:
                  beads.append(line)
                  print('GL29D_BEAD:', line)
          Path('external-bead.jsonl').write_text('\n'.join(beads) + '\n')
          with tarfile.open('external-source.tar.gz', 'w:gz') as archive:
              for path in ['src', 'tests', 'Cargo.toml', 'Cargo.lock', 'build.rs', 'rust-toolchain.toml', '.cargo', 'external-source-receipt.json', 'external-bead.jsonl']:
                  if Path(path).exists():
                      archive.add(path, arcname=path)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-source-${{ github.sha }}
          path: external-source.tar.gz
          if-no-files-found: error
          retention-days: 3
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: nightly-2026-08-31
          components: clippy, rustfmt
      - name: External provider fake-server regressions
        run: cargo test --locked --lib search::external_embedder::tests -- --nocapture
      - name: Provider selection and retained local registry regressions
        run: cargo test --locked --lib search::embedder_registry -- --nocapture
      - name: External provider formatting
        if: always()
        run: rustfmt --edition 2024 --check --config skip_children=true src/search/external_embedder.rs src/search/external_embedder/tests.rs src/search/embedder_registry.rs
