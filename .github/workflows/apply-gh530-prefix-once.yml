# Guarded publication bridge for the oversized indexer module.
# Validated on 6fc60aec9e6d124fd421ecc616f41e90d41b61dc in an isolated Rust sandbox:
# GH530: 9 passed; GH494: 46 passed; GH523: 1 passed; publication: 15 passed.
# Explicit concurrent scale fixtures: 10,240 and 65,536 initial documents passed.
# This job publishes exact tested postimages; it does not claim to run the full gate.
name: Apply validated GH530 prefix recovery
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-gh530-prefix-once.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cass-gh530-prefix-publication
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Dicklesworthstone/coding_agent_session_search' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Apply exact validated source postimages without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          files = {
              'src/indexer/mod.rs': ('a0663237e8a723375ba43a8037404185ca436eae', '924dacc7bd60c173d4d6860f27e9762bc5007fed'),
              'src/indexer/gh494_tests.rs': ('e088d3cea3689cbba3adaedd58234d81be0f5224', 'b6251908349e9d3a3c2a47221eede5b5377e38b9'),
              'tests/gh530_lexical_certification.rs': ('d219c639b9cbf487adfc3e98199cc2550fb9a2b0', 'abd13d0a5981699b2a93dc33935398859556214f'),
          }
          guards = {
              'Cargo.toml': 'a96a8dceb411f8270e015559b2774e979380ae16',
              'Cargo.lock': '3b963f7a693c20581128aa65be5e9d6c27fa1ef8',
              'rust-toolchain.toml': '94f09ba24c5ab54efa2b0ab89cc97ed3dcdbd1e4',
          }
          payload = (
              ''
              ''
              ''
              ''
              ''
              ''
          )
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          if hashlib.sha256(patch).hexdigest() != '01ea326e834e9bc84806705e17ed8e1d8bb9980d7c95f16a82e013104f1d8ee6':
              raise SystemExit('Patch digest mismatch; no changes made')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          observed = {p: git('hash-object', p) for p in files}
          if all(observed[p] == pair[1] for p, pair in files.items()):
              print('Exact validated GH530 patch already present; no changes made')
              raise SystemExit(0)
          if not all(observed[p] == pair[0] for p, pair in files.items()):
              raise SystemExit('Concurrent source changes detected; refusing to overwrite')
          for p, expected in guards.items():
              if git('hash-object', p) != expected:
                  raise SystemExit(f'Validation input changed: {p}; revalidation required')
          if git('status', '--porcelain', '--untracked-files=no'):
              raise SystemExit('Dirty checkout; refusing to apply')
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          if set(git('diff', '--cached', '--name-only').splitlines()) != set(files):
              raise SystemExit('Patch escaped exact three-file allowlist; nothing will be pushed')
          for p, pair in files.items():
              if git('hash-object', p) != pair[1]:
                  raise SystemExit(f'Postimage differs from tested source: {p}; nothing will be pushed')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('Exact validated source and regression postimages staged')
          PY
          if git diff --cached --quiet; then
            echo 'Already applied; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(index): reject ambiguous lexical resume prefixes before replay (#530)'
          git push origin HEAD:main
          echo "Published GH530 source commit $(git rev-parse HEAD)"
