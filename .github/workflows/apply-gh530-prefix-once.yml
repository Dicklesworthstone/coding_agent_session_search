# The source fix is NOT applied merely by saving this workflow.
# The exact validated patch and guarded publisher are retained in immutable
# commit be3b4534def61d337ed6c3eaf8800c57e6058735. The automatic attempt produced
# no workflow run; keep subsequent publication an explicit manual operation.
name: Apply validated GH530 prefix recovery (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cass-gh530-prefix-publication
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Dicklesworthstone/coding_agent_session_search' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Run immutable validated three-file publisher
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin be3b4534def61d337ed6c3eaf8800c57e6058735
          python3 - <<'PY'
          import subprocess
          commit = 'be3b4534def61d337ed6c3eaf8800c57e6058735'
          path = '.github/workflows/apply-gh530-prefix-once.yml'
          ref = f'{commit}:{path}'
          blob = subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
          if blob != 'cba120b0801da4bbcfef02678a11f77cadba416e':
              raise SystemExit('Immutable publisher blob mismatch; refusing to run')
          source = subprocess.check_output(['git', 'show', ref], text=True)
          marker = '        run: |\n'
          if source.count(marker) != 1:
              raise SystemExit('Unexpected publisher structure; refusing to run')
          lines = source.split(marker, 1)[1].splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('Unexpected publisher indentation; refusing to run')
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          # The immutable publisher verifies the patch SHA-256, all three file
          # preimages/postimages, dependency/toolchain guards and a clean index.
          # It refuses concurrent source changes and never force-pushes.
          subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
          PY
