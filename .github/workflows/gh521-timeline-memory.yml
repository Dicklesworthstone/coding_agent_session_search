name: GH521 timeline memory regression

on:
  push:
    branches: [main]
    paths:
      - src/lib.rs
      - src/franken_sync.rs
      - scripts/apply_gh521_timeline_fix.py
      - tests/timeline_memory_regression.rs
      - .github/workflows/gh521-timeline-memory.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh521-timeline-memory
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '16777216'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply guarded query-only fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/gh521
          git rev-parse HEAD > test-results/gh521/before-commit.txt
          python3 scripts/apply_gh521_timeline_fix.py
          python3 scripts/apply_gh521_timeline_fix.py --check
          git diff -- src/lib.rs > test-results/gh521/query-fix.patch
          git diff --check
      - name: Install the repository's pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - name: Format the new regression and verify formatting
        run: |
          rustfmt --edition 2024 tests/timeline_memory_regression.rs
          cargo fmt --all -- --check
          git diff --check
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gh521-timeline
          cache-on-failure: true
      - name: Run time, count, source, grouping, and readonly regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test timeline_memory_regression -- --test-threads=1 --nocapture 2>&1 | tee test-results/gh521/contracts.log
      - name: Run existing CLI timeline regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test cli_dispatch_coverage timeline_ -- --test-threads=1 --nocapture 2>&1 | tee test-results/gh521/existing-timeline.log
      - name: Enforce Linux RSS budget on the large archive
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test timeline_memory_regression -- --ignored --test-threads=1 --nocapture 2>&1 | tee test-results/gh521/memory.log
      - name: Clippy regression target
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --test timeline_memory_regression -- -D warnings 2>&1 | tee test-results/gh521/clippy.log
      - name: Commit the validated fix directly to main
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src/lib.rs tests/timeline_memory_regression.rs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/lib.rs tests/timeline_memory_regression.rs
            git commit -m 'fix(timeline): count selected sessions without a whole-message-table join (#521)'
            # Do not rebase after testing: that would publish an untested merge.
            # A concurrent main update must reject this fast-forward-only push.
            python3 scripts/apply_gh521_timeline_fix.py --check
            git push origin HEAD:main
            # The repository requires the legacy compatibility ref to follow main.
            # Never force either branch: concurrent updates must not be overwritten.
            git push origin HEAD:master || echo "::warning::Legacy ref was not fast-forwardable; main is preserved"
          fi
          git rev-parse HEAD | tee test-results/gh521/validated-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gh521-timeline-validation
          path: test-results/gh521/
          if-no-files-found: error
