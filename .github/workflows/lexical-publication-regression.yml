name: Lexical publication regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lexical-publication-regression.yml'
      - 'src/indexer/**'
      - 'src/search/quill_bridge.rs'
      - 'src/storage/**'
      - 'tests/e2e_index_resume.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lexical-publication-regression-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1
  RUST_MIN_STACK: '16777216'
jobs:
  regressions:
    if: github.repository == 'Dicklesworthstone/coding_agent_session_search'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture exact regression inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lexical-publication-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/lexical-publication-evidence/commit.txt"
          python3 - <<'PY'
          import os, subprocess, zipfile
          from pathlib import Path
          destination = Path(os.environ['RUNNER_TEMP']) / 'lexical-publication-evidence' / 'source.zip'
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile(destination, 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  if not name or not Path(name).is_file():
                      continue
                  if (name.startswith(('src/', 'tests/', 'docs/', '.beads/', '.cargo/'))
                          or '/' not in name) and Path(name).suffix in {'.rs', '.md', '.toml', '.lock', '.json', '.jsonl', '.yaml', '.yml'}:
                      archive.write(name, name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lexical-publication-source-${{ github.sha }}
          path: ${{ runner.temp }}/lexical-publication-evidence/
          if-no-files-found: error
          retention-days: 3
      - name: Clone sibling dependencies
        shell: bash
        run: |
          set -euo pipefail
          for dependency in asupersync frankensqlite franken_agent_detection frankensearch; do
            git clone --depth 1 "https://github.com/Dicklesworthstone/$dependency.git" "../$dependency"
            printf '%s %s\n' "$dependency" "$(git -C "../$dependency" rev-parse HEAD)" >> "$RUNNER_TEMP/lexical-publication-evidence/dependencies.txt"
          done
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db
        with:
          shared-key: lexical-publication
      - name: Verify publication, writer counts, and crash-resume regressions
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/lexical-publication-evidence/tests.log"
          cargo test --locked --lib gh494 -- --nocapture 2>&1 | tee "$log"
          cargo test --locked --lib lexical_publish -- --nocapture 2>&1 | tee -a "$log"
          cargo test --locked --lib quill_bridge -- --nocapture 2>&1 | tee -a "$log"
          cargo test --locked --test e2e_index_resume -- --nocapture 2>&1 | tee -a "$log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lexical-publication-results-${{ github.sha }}
          path: |
            ${{ runner.temp }}/lexical-publication-evidence/commit.txt
            ${{ runner.temp }}/lexical-publication-evidence/dependencies.txt
            ${{ runner.temp }}/lexical-publication-evidence/tests.log
          if-no-files-found: error
          retention-days: 7
