# Publication bridge for the oversized src/lib.rs. Validation has read-only
# repository permissions; the guarded source publication never force-pushes.
name: Apply and validate timeline GH521

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-timeline-gh521-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cass-timeline-gh521
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'Dicklesworthstone/coding_agent_session_search' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Resolve the repository-pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --version
      - name: Integrate borrowed JSON output and the canonical message index fixture
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main
          python3 - <<'PY'
          import difflib
          import re
          from pathlib import Path

          CALL = '''    // GH#521: serialize borrowed summaries directly, rather than cloning all
              // selected title/path strings into a second JSON Value tree. Keep the
              // other robot formats on their existing projection/formatting path.
              if let Some(fmt) = structured_format
                  && matches!(fmt, RobotFormat::Json | RobotFormat::Compact)
              {
                  let stdout = std::io::stdout();
                  let mut writer = std::io::BufWriter::new(stdout.lock());
                  timeline_json::write(
                      &mut writer,
                      &sessions,
                      start_ts,
                      end_ts,
                      group_by,
                      matches!(fmt, RobotFormat::Json),
                  )
                  .and_then(|()| writer.flush())
                  .map_err(|error| CliError {
                      code: 9,
                      kind: CliErrorKind::EncodeJson.kind_str(),
                      message: format!("failed to write structured output: {error}"),
                      hint: None,
                      retryable: false,
                  })?;
                  return Ok(());
              }

          '''

          def integrate(source, fixture):
              matches = list(re.finditer(r'(?m)^fn run_timeline\s*\(', source))
              if len(matches) != 1:
                  raise ValueError('Expected exactly one run_timeline')
              start = matches[0].start()
              close = re.search(r'(?m)^}\s*$', source[matches[0].end():])
              if close is None:
                  raise ValueError('Missing timeline terminator')
              end = matches[0].end() + close.end()
              body = source[start:end]
              for required in ['INDEXED BY sqlite_autoindex_messages_1', 'ORDER BY c.started_at DESC',
                               'snapshot.commit()', 'let structured_format =']:
                  if required not in body:
                      raise ValueError('Missing current timeline invariant: ' + required)
              for forbidden in ['LEFT JOIN messages', 'GROUP BY c.id']:
                  if forbidden in body:
                      raise ValueError('Do not replace the production indexed streaming count fix')
              anchor = '    if let Some(fmt) = structured_format {\n        let output = match group_by {'
              module = 'mod timeline_json;\n'
              module_anchor = 'pub mod top_session_summary;\n'
              if 'timeline_json::write(' in body:
                  if CALL not in body or source.count(module) != 1:
                      raise ValueError('Partial or changed JSON integration; manual reconciliation required')
              else:
                  if body.count(anchor) != 1 or source.count(module_anchor) != 1 or module in source:
                      raise ValueError('Unexpected dispatcher/module layout')
                  body = body.replace(anchor, CALL + anchor, 1)
                  source = source[:start] + body + source[end:]
                  source = source.replace(module_anchor, module + module_anchor, 1)
              old = 'idx INTEGER NOT NULL, role TEXT, content TEXT, created_at INTEGER\n         );'
              new = 'idx INTEGER NOT NULL, role TEXT, content TEXT, created_at INTEGER,\n             UNIQUE(conversation_id, idx)\n         );'
              if old in fixture:
                  if fixture.count(old) != 1:
                      raise ValueError('Ambiguous message schema')
                  fixture = fixture.replace(old, new, 1)
              elif new not in fixture:
                  raise ValueError('Unexpected GH521 fixture schema; no verified replacement')
              return source, fixture

          paths = [Path('src/lib.rs'), Path('tests/cli_timeline_gh521.rs')]
          before = [path.read_text() for path in paths]
          after = integrate(*before)
          if any(path.read_text() != text for path, text in zip(paths, before)):
              raise SystemExit('Files changed while preparing integration')
          for path, old, new in zip(paths, before, after):
              print(''.join(difflib.unified_diff(old.splitlines(True), new.splitlines(True),
                                               fromfile='a/' + str(path), tofile='b/' + str(path))))
              if new != old:
                  path.write_text(new)
          PY
          rustfmt --edition 2024 src/timeline_json.rs tests/cli_timeline_gh521.rs
          git diff --check
          git diff --stat
      - name: Commit directly to main without force or a PR
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add src/lib.rs src/timeline_json.rs tests/cli_timeline_gh521.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(timeline): stream borrowed JSON summaries and use the canonical index fixture (GH521)' \
              -m 'Preserve the landed metadata-first indexed streaming message counts and read snapshot. JSON and compact output serialize borrowed summaries without a second Value tree; other formats retain their prior paths. Correct the regression fixture to create the canonical covering autoindex. Native validation runs separately against this exact commit.'
            git push origin HEAD:main
          fi
          sha=$(git rev-parse HEAD)
          printf 'source_sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'Published source commit: `%s`\n\nEngine validation is the separate validate job.\n' "$sha" >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '16777216'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.apply.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record the exact source and compiler
        run: |
          git rev-parse HEAD
          git hash-object src/lib.rs src/timeline_json.rs tests/cli_timeline_gh521.rs Cargo.toml Cargo.lock
          rustc --version
          cargo --version
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compile and lint the affected integration suites
        run: cargo clippy --locked --test cli_timeline_gh521 --test cli_dispatch_coverage -- -D warnings
      - name: Borrowed JSON byte contracts, errors and large output
        run: cargo test --locked --lib timeline_json::tests -- --nocapture
      - name: Existing CLI timeline regressions
        run: cargo test --locked --test cli_dispatch_coverage timeline -- --nocapture
      - name: Inclusive windows, filters, lifetime counts and output contracts
        run: cargo test --locked --test cli_timeline_gh521 gh521_filters -- --nocapture
      - name: Archive-scale real-CASS RSS regression
        run: cargo test --locked --test cli_timeline_gh521 gh521_narrow_window -- --ignored --nocapture
