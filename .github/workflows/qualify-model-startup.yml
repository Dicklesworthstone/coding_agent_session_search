name: Qualify responsive daemon startup
on:
  push:
    branches: [main]
    paths: [.github/workflows/qualify-model-startup.yml]
permissions:
  contents: read
concurrency:
  group: cass-model-startup-landing
  cancel-in-progress: false
jobs:
  qualify-and-land:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
        working-directory: cass-source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: cass-source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dicklesworthstone/frankensearch
          ref: 6852e79a830c402ea4e55eb79eda3373c618dfc3
          path: fs-source
          persist-credentials: false
      - name: Apply the exact reviewed startup change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/startup-evidence"
          test "$(git hash-object src/daemon/models.rs)" = ae06d4e24fcc9089969a3f357dc647ce460ce1ab
          test "$(git hash-object src/daemon/models/slot.rs)" = cd393a41bce6080664b146ba6798c3dc4c9d549c
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess
          from pathlib import Path
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          source = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/cfcdb6ed696ed62a0c6a61600cecd0e171668dde'], text=True))
          compressed = base64.b64decode(source['content'])
          assert blob(compressed) == 'cfcdb6ed696ed62a0c6a61600cecd0e171668dde'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == 'dbb8b70c6cbb8f50e0189e86383378a5fe445528f69d52a5065f2c3733104ec2'
          expected = {'src/daemon/core.rs': ('12a48c93c8019d6660a9d29eee0bfe570313a2f5', '6f257bba1f689d88da80d881f63a520c2151a8e0'), 'src/daemon/core/inference/budget.rs': ('d3558ad885b4e881ff1be1b705832630c64e33d8', '4cc402cc2fa76e289df46b14e6e676d1fc5aa542'), 'src/daemon/core/startup.rs': (None, 'e7f851f435912272581d6b3b52f09351817f7a22'), 'src/daemon/core/startup_integration.rs': (None, '98d85dbe6a9e78eda90d7c291218054e268e14da')}
          for name, (before, _) in expected.items():
              path = Path(name)
              assert not path.is_symlink()
              assert (not path.exists()) if before is None else blob(path.read_bytes()) == before, name
          evidence = Path(os.environ['RUNNER_TEMP']) / 'startup-evidence'
          (evidence / 'reviewed.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--whitespace=error-all', str(evidence / 'reviewed.patch')], check=True)
          subprocess.run(['git', 'apply', str(evidence / 'reviewed.patch')], check=True)
          for name, (_, after) in expected.items():
              assert blob(Path(name).read_bytes()) == after, name
          (evidence / 'base.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True))
          PY
          rustup component add rustfmt
          rustfmt --edition 2024 src/daemon/core/startup.rs src/daemon/core/startup_integration.rs
          for source in src/daemon/core.rs src/daemon/core/inference/budget.rs; do
            rustfmt --edition 2024 --config skip_children=true --emit stdout "$source" > "$RUNNER_TEMP/parsed.rs"
          done
          git diff --check
      - name: Execute complete production startup, gate, wire and model components
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path.cwd()
          upstream = Path(os.environ['GITHUB_WORKSPACE']) / 'fs-source/frankensearch'
          dest = Path(os.environ['RUNNER_TEMP']) / 'startup-harness'
          copied = {}
          paths = ['src/daemon/models.rs', 'src/daemon/models/slot.rs', 'src/daemon/protocol.rs', 'src/daemon/core/startup.rs', 'src/daemon/core/wire.rs', 'src/daemon/core/inference/budget.rs']
          for rel in paths:
              data = (root / rel).read_bytes()
              (dest / rel).parent.mkdir(parents=True, exist_ok=True)
              (dest / rel).write_bytes(data)
              copied[rel] = hashlib.sha256(data).hexdigest()
          lines = ['pub mod search {']
          for name in ['embedder', 'reranker', 'hash_embedder', 'fastembed_embedder', 'fastembed_reranker', 'policy']:
              lines.append('#[path = ' + json.dumps(str(root / ('src/search/' + name + '.rs'))) + '] pub mod ' + name + ';')
          lines.append('}\npub mod daemon {\npub mod models;\npub mod protocol;\npub mod core {\nmod startup;\nmod wire;\nmod inference {\nmod budget;\npub(super) use budget::InferenceGate;\n}\n}\n}')
          (dest / 'src/lib.rs').write_text('\n'.join(lines))
          evidence = Path(os.environ['RUNNER_TEMP']) / 'startup-evidence'
          (evidence / 'harness-source-identities.json').write_text(json.dumps(copied, indent=2))
          (dest / 'Cargo.toml').write_text('[package]\nname="cass-startup-check"\nversion="0.0.0"\nedition="2024"\n[dependencies]\nfrankensearch={path=' + json.dumps(str(upstream)) + ', default-features=false, features=["hash", "native"]}\nparking_lot="=0.12.5"\nserde={version="1", features=["derive"]}\nserde_json="1"\nrmp-serde="1.3.1"\ndotenvy="0.15.7"\nthiserror="2"\ntracing="0.1"\ntoml="1.1.2"\ntempfile="3"\n')
          PY
          export CARGO_TARGET_DIR="$RUNNER_TEMP/startup-target"
          cd "$RUNNER_TEMP/startup-harness"
          cargo generate-lockfile
          cp Cargo.lock "$RUNNER_TEMP/startup-evidence/component-Cargo.lock"
          timeout 600 cargo test --locked daemon:: -- --nocapture --test-threads=2 2>&1 | tee "$RUNNER_TEMP/startup-evidence/tests.log"
          grep -Eq 'test result: ok\. 59 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/startup-evidence/tests.log"
      - name: Record the shipping locked-CASS result separately
        run: |
          set -uo pipefail
          set +e
          timeout 90 cargo test --locked --lib daemon::core::startup -- --nocapture > "$RUNNER_TEMP/startup-evidence/full-cass.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/startup-evidence/full-cass-exit.txt"
          cat "$RUNNER_TEMP/startup-evidence/full-cass.log"
      - name: Commit the tested startup ownership and serving-loop wiring
        id: publish
        run: |
          set -euo pipefail
          git add -- src/daemon/core.rs src/daemon/core/inference/budget.rs src/daemon/core/startup.rs src/daemon/core/startup_integration.rs
          test "$(git diff --cached --name-only | wc -l)" = 4
          git diff --cached --check
          git hash-object src/daemon/core.rs src/daemon/core/inference/budget.rs src/daemon/core/startup.rs src/daemon/core/startup_integration.rs > "$RUNNER_TEMP/startup-evidence/published-blobs.txt"
          git diff --cached > "$RUNNER_TEMP/startup-evidence/published.patch"
          full=$(cat "$RUNNER_TEMP/startup-evidence/full-cass-exit.txt")
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(daemon): serve health and shutdown during owned model warm-up' -m 'Move native startup into a scoped worker that owns inference admission before the first accept. Keep controls and heartbeats live, skip later stages after cancellation, join pending loads and embedding workers before cleanup, and publish coherent ModelInfo snapshots. Add seven lifecycle tests and two real-serving-loop integration regressions.' -m "Executed 59 actual component tests covering model slots/manager, startup ownership, inference budget, real wire I/O and complete protocol against pinned upstream native wrappers. These do not compile the entire core dispatcher. Full locked CASS exit=$full; the two new serving-loop integration tests require separate whole-CASS qualification."
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/main; then
              commit=$(git rev-parse HEAD)
              echo "commit=$commit" >> "$GITHUB_OUTPUT"
              printf '%s\n' "$commit" > "$RUNNER_TEMP/startup-evidence/commit.txt"
              exit 0
            fi
            parent=$(git rev-parse HEAD^)
            git fetch --depth=100 origin main
            test -z "$(git diff --name-only "$parent" FETCH_HEAD -- src/daemon src/search/embedder.rs src/search/reranker.rs src/search/hash_embedder.rs src/search/fastembed_embedder.rs src/search/fastembed_reranker.rs src/search/policy.rs Cargo.toml Cargo.lock)"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' rebase FETCH_HEAD
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: daemon-startup-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/startup-evidence/
          retention-days: 14
  full-source-probe:
    needs: qualify-and-land
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.qualify-and-land.outputs.commit }}
          path: cass-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dicklesworthstone/frankensearch
          ref: 6852e79a830c402ea4e55eb79eda3373c618dfc3
          path: fs-source
          persist-credentials: false
      - name: Attempt complete CASS startup tests using an isolated source override
        shell: bash
        working-directory: cass-source
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/source-probe-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/source-probe-evidence/commit.txt"
          cp Cargo.lock "$RUNNER_TEMP/source-probe-evidence/shipping-Cargo.lock"
          override="patch.crates-io.frankensearch.path=\"$GITHUB_WORKSPACE/fs-source/frankensearch\""
          export CARGO_TARGET_DIR="$RUNNER_TEMP/full-source-target"
          set +e
          timeout 600 cargo test --config "$override" --lib daemon::core::startup_integration:: -- --nocapture --test-threads=2 > "$RUNNER_TEMP/source-probe-evidence/full-source.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/source-probe-evidence/exit.txt"
          cp Cargo.lock "$RUNNER_TEMP/source-probe-evidence/resolved-Cargo.lock"
          cat "$RUNNER_TEMP/source-probe-evidence/full-source.log"
          printf 'SOURCE_OVERRIDE_EXIT=%s; this is not the shipping locked dependency graph\n' "$status"
          test "$status" = 0
          grep -Eq 'test result: ok\. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/source-probe-evidence/full-source.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-source-startup-probe-${{ github.sha }}
          path: ${{ runner.temp }}/source-probe-evidence/
          retention-days: 14
