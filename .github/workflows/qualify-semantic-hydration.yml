# Explicit full-crate qualification; this workflow cannot publish repository changes.
name: Verify source-bound semantic hydration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/qualify-semantic-hydration.yml
      - src/search/semantic_reader/publication/text/hydration/**
      - src/search/semantic_reader/publication/text/hydration.rs
permissions:
  contents: read
jobs:
  shipping-hydration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: false
      - name: Record exact shipping inputs and source
        run: |
          mkdir -p "$RUNNER_TEMP/hydration-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/hydration-evidence/commit.txt"
          sha256sum Cargo.lock Cargo.toml rust-toolchain.toml src/search/semantic_reader/publication/text.rs src/search/semantic_reader/publication/text/hydration.rs src/search/semantic_reader/publication/text/hydration/tests.rs > "$RUNNER_TEMP/hydration-evidence/source.sha256"
      - name: Execute all source-bound hydration regressions in the complete CASS crate
        shell: bash
        run: |
          set +e
          timeout 1200 cargo test --locked --lib search::semantic_reader::publication::text::hydration:: -- --nocapture --test-threads=2 > "$RUNNER_TEMP/hydration-evidence/tests.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/hydration-evidence/tests.exit"
          cat "$RUNNER_TEMP/hydration-evidence/tests.log"
          git diff --exit-code -- Cargo.toml Cargo.lock rust-toolchain.toml || exit 1
          test "$status" -eq 0 || exit "$status"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP']) / 'hydration-evidence/tests.log').read_text()
          counts = re.findall(r'test result: ok\. (\d+) passed; 0 failed; 0 ignored;', log)
          if not counts or max(map(int, counts)) < 16:
              raise SystemExit('Expected at least 16 passing hydration tests; an empty filter is not qualification')
          expected = []
          for file in [
              'src/search/semantic_reader/publication/text/hydration/query/current/progressive/tests.rs',
              'src/search/semantic_reader/publication/text/hydration/query/tests/retained/progressive/current.rs',
          ]:
              expected.extend(re.findall(r'#\[test\]\s*fn\s+(\w+)', Path(file).read_text()))
          if len(expected) != 13:
              raise SystemExit('Expected all 13 current-progressive regression functions')
          for name in expected:
              if not re.search(r'^test [^\n]*::' + re.escape(name) + r' \.\.\. ok$', log, re.M):
                  raise SystemExit('Regression did not execute successfully: ' + name)
          PY
      - name: Check formatting without modifying the tested source
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check --config skip_children=true src/search/semantic_reader/publication/text.rs src/search/semantic_reader/publication/text/hydration.rs src/search/semantic_reader/publication/text/hydration/tests.rs 2>&1 | tee "$RUNNER_TEMP/hydration-evidence/format.log"
          find src/search/semantic_reader/publication/text/hydration -name '*.rs' -print0 | sort -z | xargs -0 rustfmt --edition 2024 --check --config skip_children=true 2>&1 | tee -a "$RUNNER_TEMP/hydration-evidence/format.log"
      - name: Run full-library Clippy under the shipping lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --lib -- -D warnings 2>&1 | tee "$RUNNER_TEMP/hydration-evidence/clippy.log"
      - name: Retain exact sources and separate formatter suggestions
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path('src/search/semantic_reader/publication/text/hydration')
          evidence = Path(os.environ['RUNNER_TEMP']) / 'hydration-evidence'
          hashes = {}
          for path in sorted(root.rglob('*.rs')):
              data = path.read_bytes()
              hashes[str(path)] = hashlib.sha256(data).hexdigest()
              destination = evidence / 'source' / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              result = subprocess.run(['rustfmt', '--edition', '2024', '--config',
                  'skip_children=true', '--emit', 'stdout', str(path)],
                  capture_output=True, timeout=30)
              if result.returncode == 0:
                  formatted = evidence / 'formatted' / path
                  formatted.parent.mkdir(parents=True, exist_ok=True)
                  formatted.write_bytes(result.stdout)
          (evidence / 'all-source.sha256.json').write_text(json.dumps(hashes, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-hydration-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/hydration-evidence/
          if-no-files-found: warn
          retention-days: 14
