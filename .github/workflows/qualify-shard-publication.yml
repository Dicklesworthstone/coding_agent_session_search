# Guarded source-only landing; the connector retires write permissions after success.
name: Qualify immutable shard builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/qualify-shard-publication.yml]
permissions:
  contents: write
concurrency:
  group: cass-shard-publication-qualification
  cancel-in-progress: false
jobs:
  qualify-and-land:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      CARGO_NET_RETRY: '1'
      RUST_MIN_STACK: '134217728'
    defaults:
      run:
        working-directory: cass-source
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: cass-source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dicklesworthstone/frankensearch
          ref: 6852e79a830c402ea4e55eb79eda3373c618dfc3
          path: fs-source
          persist-credentials: false
      - name: Guard source identities and apply reviewed patches
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/shard-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/shard-evidence/parent.txt"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
              'src/indexer/semantic.rs': 'e00464061bd41b9c8bc765d9077dadf60edd7867',
              'src/search/semantic_manifest.rs': '45e12506457d0b9823d25fd65e08a9a7a3cc83a0',
              'src/search/hash_embedder.rs': 'e8487cf35172492e4ea609748572e7385bf0ee06',
              'src/search/vector_index.rs': '7e2adc8aa0535af69cb478385b97d05ffb6df41d',
              'src/search/fastembed_embedder.rs': 'c97185b2a38140e16680ecbb4cf8bd057ad2f819',
              'src/search/policy.rs': '44b59c96535139a5df34801dfdd14ef3e21ecbe3',
              'src/search/canonicalize.rs': '8ef9cf0a3fbecf7211f827b2d659f25f1bd711c5',
              'src/indexer/semantic/shard_publication_tests.rs': '8b264b36fe34602d461fbdb092e902d9c81f6d77',
              'scripts/verify_shard_publication.py': '329774cc72af4c69dd9a50b5582939ccd4710512',
              'scripts/patches/shard-build-isolation.patch': 'dd3392d0ccc2642539f7c11824a0bda9f9e43d38',
              'scripts/patches/shard-harness-bindings.patch': '830642631780845b7120b47fd10ec9fc2981aaf4',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if Path(path).is_symlink() or actual != sha:
                  raise SystemExit('Changed source requires review: ' + path)
          PY
          cp src/indexer/semantic.rs "$RUNNER_TEMP/parent-semantic.rs"
          git apply --check --whitespace=error-all scripts/patches/shard-build-isolation.patch scripts/patches/shard-harness-bindings.patch
          git apply --whitespace=error-all scripts/patches/shard-build-isolation.patch scripts/patches/shard-harness-bindings.patch
          rustc --version
          rustfmt --edition 2024 src/indexer/semantic/shard_publication_tests.rs
          rustfmt --edition 2024 --config skip_children=true --emit stdout src/indexer/semantic.rs > "$RUNNER_TEMP/semantic-parsed.rs"
          git diff --check
      - name: RED - reproduce installed shard overwrite with unchanged production code
        run: |
          set -euo pipefail
          python3 scripts/verify_shard_publication.py "$PWD" "$GITHUB_WORKSPACE/fs-source" "$RUNNER_TEMP/shard-red" --indexer-source "$RUNNER_TEMP/parent-semantic.rs"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/shard-target"
          cd "$RUNNER_TEMP/shard-red"
          cargo generate-lockfile
          cp Cargo.lock "$RUNNER_TEMP/shard-evidence/component-Cargo.lock"
          set +e
          cargo test --locked repeated_source_fingerprint_publishes_new_paths_and_preserves_old_native_readers -- --nocapture > "$RUNNER_TEMP/shard-evidence/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/shard-evidence/red.log"
          test "$status" -ne 0
          grep -F 'a rebuild must not reuse installed vector paths' "$RUNNER_TEMP/shard-evidence/red.log"
          grep -F 'test result: FAILED. 0 passed; 1 failed;' "$RUNNER_TEMP/shard-evidence/red.log"
          cp source-receipt.json "$RUNNER_TEMP/shard-evidence/red-source-receipt.json"
      - name: GREEN - execute production publication and hash producer tests
        run: |
          set -euo pipefail
          python3 scripts/verify_shard_publication.py "$PWD" "$GITHUB_WORKSPACE/fs-source" "$RUNNER_TEMP/shard-green"
          cp "$RUNNER_TEMP/shard-red/Cargo.lock" "$RUNNER_TEMP/shard-green/Cargo.lock"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/shard-target"
          cd "$RUNNER_TEMP/shard-green"
          cargo test --locked -- --nocapture --test-threads=2 2>&1 | tee "$RUNNER_TEMP/shard-evidence/green.log"
          grep -Eq 'test result: ok\. 25 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/shard-evidence/green.log"
          cp source-receipt.json "$RUNNER_TEMP/shard-evidence/green-source-receipt.json"
      - name: Record component lint and locked CASS qualification independently
        id: checks
        run: |
          set -uo pipefail
          set +e
          CARGO_TARGET_DIR="$RUNNER_TEMP/shard-target" cargo clippy --manifest-path "$RUNNER_TEMP/shard-green/Cargo.toml" --locked --all-targets -- -D warnings > "$RUNNER_TEMP/shard-evidence/clippy.log" 2>&1
          lint=$?
          timeout 90 env CARGO_TARGET_DIR="$RUNNER_TEMP/shard-full-target" cargo test --locked --lib indexer::semantic::shard_publication_tests -- --nocapture > "$RUNNER_TEMP/shard-evidence/locked-cass.log" 2>&1
          full=$?
          set -e
          cat "$RUNNER_TEMP/shard-evidence/clippy.log" "$RUNNER_TEMP/shard-evidence/locked-cass.log"
          printf 'component_clippy=%s\nlocked_cass=%s\n' "$lint" "$full" | tee "$RUNNER_TEMP/shard-evidence/checks.txt" >> "$GITHUB_OUTPUT"
      - name: Commit tested source-only changes directly to main
        env:
          LINT_EXIT: ${{ steps.checks.outputs.component_clippy }}
          FULL_EXIT: ${{ steps.checks.outputs.locked_cass }}
        run: |
          set -euo pipefail
          git add -- src/indexer/semantic.rs src/indexer/semantic/shard_publication_tests.rs scripts/verify_shard_publication.py
          python3 - <<'PY'
          import subprocess
          paths = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert 'src/indexer/semantic.rs' in paths
          assert paths <= {'src/indexer/semantic.rs', 'src/indexer/semantic/shard_publication_tests.rs', 'scripts/verify_shard_publication.py'}, paths
          PY
          git diff --cached --check
          git hash-object src/indexer/semantic.rs src/indexer/semantic/shard_publication_tests.rs scripts/verify_shard_publication.py > "$RUNNER_TEMP/shard-evidence/tested-blobs.txt"
          tar -czf "$RUNNER_TEMP/shard-evidence/tested-source.tar.gz" src/indexer/semantic.rs src/indexer/semantic/shard_publication_tests.rs scripts/verify_shard_publication.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit \
            -m 'fix(index): isolate semantic shard builds before manifest publication' \
            -m 'Allocate a unique generation directory for every build, including rebuilds of the same database fingerprint. Publish only completed vector/ANN paths; failed builds cannot overwrite installed files. Strictly reject malformed/future manifests at preflight and publication, preserve other tiers, and avoid allocation from the shard-size limit before input arrives. Failed unreferenced generations remain for explicit inspection/GC; no old artifacts are removed.' \
            -m "RED reproduced installed-path reuse with the unchanged production writer. GREEN ran 25 tests of exact writer/manifest methods and the actual hash control producer against real pinned FSVI/HNSW. Component Clippy exit=$LINT_EXIT; locked CASS test exit=$FULL_EXIT. This independent graph is not full CLI/model/RCH/UBS or archive-scale qualification. Concurrent manifest publication remains separate."
          for attempt in 1 2 3; do
            if GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/main; then
              git rev-parse HEAD | tee "$RUNNER_TEMP/shard-evidence/published-commit.txt"
              exit 0
            fi
            parent=$(git rev-parse HEAD^)
            git fetch --depth=100 origin main
            test -z "$(git diff --name-only "$parent" FETCH_HEAD -- src/indexer/semantic.rs src/indexer/semantic/shard_publication_tests.rs src/search/semantic_manifest.rs src/search/hash_embedder.rs src/search/embedder.rs src/search/vector_index.rs src/search/policy.rs src/search/canonicalize.rs scripts/verify_shard_publication.py scripts/verify_message_topk_fsvi.py Cargo.toml Cargo.lock)"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' rebase FETCH_HEAD
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shard-publication-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/shard-evidence
          retention-days: 14
