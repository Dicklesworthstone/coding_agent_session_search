name: Source ledger contract
on:
  push:
    branches: [main]
    paths:
      - src/indexer/mod.rs
      - src/indexer/source_ledger_tests.rs
      - src/connectors/**
      - tests/e2e_index_resume.rs
      - tests/e2e_source_ledger.rs
      - scripts/test_source_ledger_matcher.py
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - rust-toolchain.toml
      - .github/workflows/source-ledger.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discovery-source:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Export exact discovery-window fix without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, tarfile, tempfile, urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'Dicklesworthstone/coding_agent_session_search'
          api = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def request(path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(api + path, data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def digest(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def blob(sha):
              result = request('/git/blobs/' + sha)
              assert result['encoding'] == 'base64'
              data = base64.b64decode(result['content'])
              assert digest(data) == sha
              return data
          bases = {
              'src/indexer/mod.rs': 'd5aabca367f665afff7913e314646d72ea8cdd46',
              'src/indexer/source_ledger_tests.rs': '3121bfbc9f686866729a6fceb372c00fe98869da',
              'src/connectors/source_dependencies/observation.rs': '70f2abc6bf852f1f7c1579c7b8b1014bab66efe1',
          }
          candidates = {
              'src/indexer/mod.rs': '47aeceb1d594b7a27c70d44433feb43d3e5ccdbf',
              'src/indexer/source_ledger_tests.rs': 'e85d62cdd941ebecb6304c66a83b166d027ca7cf',
              'src/connectors/source_dependencies/observation.rs': '34a243d3355360df17b1a3585a4740edb7684e58',
          }
          patch = blob('911d697aa337ec35bec13e46590888d393716748')
          output = Path(os.environ['GITHUB_WORKSPACE'])
          with tempfile.TemporaryDirectory(prefix='gh512-discovery-') as directory:
              work = Path(directory)
              subprocess.run(['git', 'init', '-q'], cwd=work, check=True)
              for name, sha in bases.items():
                  current = request('/contents/' + name + '?ref=' + os.environ['GITHUB_SHA'])
                  assert current['sha'] == sha, 'source drift: ' + name
                  path = work / name
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(blob(sha))
              subprocess.run(['git', 'add', '--', *sorted(bases)], cwd=work, check=True)
              subprocess.run(['git', 'apply', '--check', '--whitespace=error-all', '-'], cwd=work, input=patch, check=True)
              subprocess.run(['git', 'apply', '--whitespace=error-all', '-'], cwd=work, input=patch, check=True)
              for name, sha in candidates.items():
                  assert digest((work / name).read_bytes()) == sha, 'candidate mismatch: ' + name
              subprocess.run(['rustfmt', '--edition', '2024', '--config', 'skip_children=true', *sorted(bases)], cwd=work, check=True)
              subprocess.run(['rustfmt', '--edition', '2024', '--check', '--config', 'skip_children=true', *sorted(bases)], cwd=work, check=True)
              subprocess.run(['git', 'diff', '--check'], cwd=work, check=True)
              changed = set(subprocess.check_output(['git', 'diff', '--name-only'], cwd=work, text=True).splitlines())
              assert changed == set(bases), changed
              receipt = {'source_commit': os.environ['GITHUB_SHA'], 'bases': bases, 'blobs': {}}
              for name in sorted(bases):
                  data = (work / name).read_bytes()
                  result = request('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
                  assert result['sha'] == digest(data), name
                  receipt['blobs'][name] = result['sha']
              (output / 'gh512-discovery-source.json').write_text(json.dumps(receipt, indent=2) + '\n')
              with tarfile.open(output / 'gh512-discovery-source.tar.gz', 'w:gz') as archive:
                  for name in sorted(bases):
                      archive.add(work / name, arcname=name)
              print('GH512_DISCOVERY_SOURCE=' + json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gh512-discovery-${{ github.sha }}
          path: |
            gh512-discovery-source.json
            gh512-discovery-source.tar.gz
          if-no-files-found: error
          retention-days: 7
  matcher:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Verify committed source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Ensure native linker is available
        run: |
          if ! command -v cc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc libc6-dev
          fi
      - name: Native production matcher tests and same-invocation workload benchmark
        run: |
          set -o pipefail
          python3 scripts/test_source_ledger_matcher.py --bench 2>&1 | tee gh512-native-matcher.log
      - name: Verify validation did not alter committed sources
        if: always()
        run: git diff --exit-code HEAD -- src scripts tests Cargo.toml Cargo.lock build.rs rust-toolchain.toml .cargo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gh512-matcher-${{ github.sha }}
          path: gh512-native-matcher.log
          if-no-files-found: error
          retention-days: 7
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the committed source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: nightly-2026-08-31
          components: clippy, rustfmt
      - name: Source ledger regressions
        run: cargo test --locked --lib source_ledger -- --nocapture
      - name: Existing primary identity and sidecar observation guards
        run: cargo test --locked --lib gh426_source_observation -- --nocapture
      - name: Connector capability registration regressions
        run: cargo test --locked --lib source_dependencies -- --nocapture
      - name: Same-invocation 4159-source 10-folder reuse benchmark
        run: cargo test --locked --lib gh512_benchmark_4159 -- --ignored --nocapture
      - name: Durable source completion and persisted CLI resume regressions
        run: cargo test --locked --test e2e_index_resume -- --nocapture
      - name: Persisted legacy reuse and primary append through both real providers
        run: cargo test --locked --test e2e_source_ledger -- --nocapture
      - name: Focused Rust lint gate
        run: cargo clippy --locked --lib -- -D warnings
      - name: Touched source formatting gate
        if: always()
        run: rustfmt --edition 2024 --check --config skip_children=true src/indexer/mod.rs src/indexer/source_ledger_tests.rs src/connectors/mod.rs src/connectors/source_dependencies.rs src/connectors/source_dependencies/observation.rs tests/e2e_index_resume.rs tests/e2e_source_ledger.rs
      - name: Verify validation did not alter committed sources
        if: always()
        run: git diff --exit-code HEAD -- src tests Cargo.toml Cargo.lock build.rs rust-toolchain.toml .cargo
