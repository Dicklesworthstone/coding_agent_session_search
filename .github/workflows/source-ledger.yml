name: Source ledger contract
on:
  push:
    branches: [main]
    paths:
      - src/indexer/mod.rs
      - src/indexer/source_ledger_tests.rs
      - src/connectors/**
      - tests/e2e_index_resume.rs
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - rust-toolchain.toml
      - .github/workflows/source-ledger.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the committed source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: nightly-2026-08-31
          components: clippy, rustfmt
      - name: Source ledger regressions
        run: cargo test --locked --lib source_ledger -- --nocapture
      - name: Existing primary identity and sidecar observation guards
        run: cargo test --locked --lib gh426_source_observation -- --nocapture
      - name: Connector capability registration regressions
        run: cargo test --locked --lib source_dependencies -- --nocapture
      - name: Same-invocation 4159-source 10-folder reuse benchmark
        run: cargo test --locked --lib gh512_benchmark_4159 -- --ignored --nocapture
      - name: Durable source completion and persisted CLI resume regressions
        run: cargo test --locked --test e2e_index_resume -- --nocapture
      - name: Focused Rust lint gate
        run: cargo clippy --locked --lib -- -D warnings
      - name: Touched source formatting gate
        if: always()
        run: rustfmt --edition 2024 --check --config skip_children=true src/indexer/mod.rs src/indexer/source_ledger_tests.rs src/connectors/mod.rs src/connectors/source_dependencies.rs tests/e2e_index_resume.rs
      - name: Verify validation did not alter committed sources
        if: always()
        run: git diff --exit-code HEAD -- src tests Cargo.toml Cargo.lock build.rs rust-toolchain.toml .cargo
