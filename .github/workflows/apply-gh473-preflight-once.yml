name: Finalize GH473 preflight error semantics
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-gh473-preflight-once.yml]
permissions:
  contents: write
concurrency:
  group: cass-gh473-preflight-application
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_TERM_COLOR: never
  CARGO_NET_RETRY: '1'
  RUST_MIN_STACK: '134217728'
  RUST_BACKTRACE: '1'
jobs:
  qualify:
    if: github.repository == 'Dicklesworthstone/coding_agent_session_search'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Guard and apply typed permanent-error classification
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import hashlib
          import importlib.util
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('gh473', root / 'scripts/verify_gh473_core.py')
          probe = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          def once(text, old, new):
              if text.count(old) != 1:
                  raise SystemExit('Unexpected source context; refusing rewrite: ' + repr(old))
              return text.replace(old, new, 1)
          path = root / 'src/indexer/mod.rs'
          original = path.read_text()
          classifier = probe.definition(original, 'anyhow_chain_indicates_retryable_storage_contention')
          message_classifier = probe.definition((root / 'src/storage/sqlite.rs').read_text(), 'retryable_storage_error_message')
          print('=== Current fallback classifiers ===\n' + classifier + message_classifier)
          assert 'retryable_storage_error_message' in classifier
          assert 'lower.contains("locked")' in message_classifier
          # Typed engine causes take precedence over diagnostic/path wording.
          # Preserve the existing textual fallback for untyped errors.
          guard = '''
              use crate::franken_sync::FrankenError;

              if let Some(engine_error) = err
                  .chain()
                  .find_map(|cause| cause.downcast_ref::<FrankenError>())
              {
                  return matches!(
                      engine_error,
                      FrankenError::Busy
                          | FrankenError::BusyRecovery
                          | FrankenError::BusySnapshot { .. }
                          | FrankenError::WriteConflict { .. }
                          | FrankenError::SerializationFailure { .. }
                  );
              }
          '''
          assert 'downcast_ref::<FrankenError>' not in classifier
          opening = classifier.index('{') + 1
          revised = classifier[:opening] + guard + classifier[opening:]
          source = once(original, classifier.rstrip('\n'), revised.rstrip('\n'))
          for name in ['index_writer_busy_timeout_ms', 'with_concurrent_retry', 'is_retryable_franken_error', 'persist_conversations_batched_inner']:
              a, b = probe.definition(original, name), probe.definition(source, name)
              assert a == b, 'Unexpected change to preserved policy: ' + name
              print('unchanged', name, hashlib.sha256(a.encode()).hexdigest())
          print(''.join(difflib.unified_diff(original.splitlines(True), source.splitlines(True), fromfile='a/src/indexer/mod.rs', tofile='b/src/indexer/mod.rs')))
          path.write_text(source)
          tests_path = root / 'src/indexer/gh473_tests.rs'
          tests = tests_path.read_text()
          readonly_test = '''    fn readonly_preflight_is_permanent(primary: bool) {
                  let tmp = TempDir::new().unwrap();
                  let storage = FrankenStorage::open(&tmp.path().join("busy-readonly.db")).unwrap();
                  if primary {
                      storage.enable_bulk_single_connection();
                      storage.raw().execute("PRAGMA query_only = ON").unwrap();
                  } else {
                      let (writer, reusable) = storage.acquire_cached_ephemeral_writer().unwrap();
                      assert!(reusable);
                      writer.raw().execute("PRAGMA query_only = ON").unwrap();
                      storage.release_cached_ephemeral_writer(writer);
                  }
                  let mut attempts = 0;
                  let mut bodies = 0;
                  let result = persist::with_concurrent_retry(2, || {
                      attempts += 1;
                      persist::with_ephemeral_writer(&storage, false, "GH473 read-only preflight", |_| {
                          bodies += 1;
                          Ok(())
                      })
                  });
                  let err = result.expect_err("query-only writers must reject preflight");
                  assert!(err.downcast_ref::<crate::franken_sync::FrankenError>().is_some());
                  assert!(!anyhow_chain_indicates_retryable_storage_contention(&err), "permanent error misclassified: {err:#}");
                  assert_eq!((attempts, bodies), (1, 0));
                  assert!(!storage.ephemeral_writer_preflight_verified());
                  assert_eq!(scalar(&storage, "SELECT COUNT(*) FROM messages"), 0);
                  assert!(storage.source_ingest_ledger_entries().unwrap().is_empty());
                  if primary {
                      storage.raw().execute("PRAGMA query_only = OFF").unwrap();
                  }
                  storage.close().unwrap();
              }

          '''
          tests = once(tests, '    #[test]\n    fn writer_preflight_contention_regression()', readonly_test + '    #[test]\n    fn writer_preflight_contention_regression()')
          tests = once(tests, '                preflight_contention(expected, false, primary);', '                preflight_contention(expected, false, primary);\n                readonly_preflight_is_permanent(primary);')
          tests_path.write_text(tests)
          probe_path = root / 'scripts/verify_gh473_core.py'
          script = probe_path.read_text()
          extra = '''    storage_source = (root / "src/storage/sqlite.rs").read_text()
              fallback_message = definition(storage_source, "retryable_storage_error_message")
              fallback_classifier = definition(source, "anyhow_chain_indicates_retryable_storage_contention")
              program = program.replace("mod production {", "mod storage { pub mod sqlite {\\n" + fallback_message + "}}\\nmod production {\\n" + fallback_classifier, 1)
              program = program.replace('assert!(is_retryable_franken_error(&err));', 'assert!(is_retryable_franken_error(&err));\\n    assert!(anyhow_chain_indicates_retryable_storage_contention(&err));')
              program = program.replace('assert!(!is_retryable_franken_error(&err));', 'assert!(!is_retryable_franken_error(&err));\\n    assert!(!anyhow_chain_indicates_retryable_storage_contention(&err));')
              readonly_check = """    writer.execute("PRAGMA query_only = ON")?;
              let mut readonly_attempts = 0;
              let readonly = with_concurrent_retry(2, || {
                  readonly_attempts += 1;
                  attempt(&writer, &path)
              });
              let err = readonly.expect_err("query-only preflight must fail permanently");
              assert!(!is_retryable_franken_error(&err));
              assert!(!anyhow_chain_indicates_retryable_storage_contention(&err));
              assert_eq!(readonly_attempts, 1);
              writer.execute("PRAGMA query_only = OFF")?;
              println!("GH473_CORE_READONLY_OK attempts={readonly_attempts}");
          """
              anchor = '    assert!(started.elapsed() < Duration::from_secs(5), "short waits regressed");'
              if program.count(anchor) != 1:
                  raise ValueError("Missing unique probe assertion anchor")
              program = program.replace(anchor, readonly_check + anchor, 1)
              print("exact_fallback_functions", hashlib.sha256((fallback_message + fallback_classifier).encode()).hexdigest())
          '''
          script = once(script, '    manifest_source = (root / "Cargo.toml").read_text()\n', extra + '    manifest_source = (root / "Cargo.toml").read_text()\n')
          compile(script, str(probe_path), 'exec')
          probe_path.write_text(script)
          # Retire write permissions in the same commit as the production fix.
          workflow = root / '.github/workflows/apply-gh473-preflight-once.yml'
          workflow.write_text('name: Verify GH473 preflight source\non:\n  workflow_dispatch:\npermissions:\n  contents: read\njobs:\n  verify:\n    runs-on: ubuntu-latest\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262\n        with:\n          persist-credentials: false\n      - run: python3 scripts/verify_gh473_core.py "$RUNNER_TEMP/gh473-source-check"\n')
          PY
      - name: Parse and format touched Rust
        run: |
          set -euo pipefail
          rustfmt --edition 2024 src/indexer/gh473_tests.rs
          rustfmt --edition 2024 --config skip_children=true --emit stdout src/indexer/mod.rs > "$RUNNER_TEMP/gh473-parsed.rs"
          git diff --check
      - name: Commit the narrow fix without overwriting concurrent work
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/indexer/mod.rs src/indexer/gh473_tests.rs scripts/verify_gh473_core.py .github/workflows/apply-gh473-preflight-once.yml
          git diff --cached --stat
          git commit -m 'fix(index): distinguish typed permanent preflight errors from contention (GH473)'
          git push origin HEAD:main
          git rev-parse HEAD
      - name: Build and exercise the exact-source real-engine probe
        run: |
          set -euo pipefail
          python3 scripts/verify_gh473_core.py "$RUNNER_TEMP/gh473-core"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/gh473-core-target"
          cd "$RUNNER_TEMP/gh473-core"
          cargo generate-lockfile
          sha256sum Cargo.lock
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          family = [(p['name'], p['version']) for p in tomllib.loads(Path('Cargo.lock').read_text())['package'] if p['name'].startswith('fsqlite')]
          print(family)
          assert family and all(version == '0.4.4' for _, version in family)
          PY
          timeout 900s cargo build --locked
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          binary = root / 'gh473-core-target/debug/cass-gh473-core-probe'
          for value, expected in [(None, 10), ('0', 10), ('invalid', 10), ('-1', 10), ('18446744073709551616', 10), ('37', 37)]:
              env = dict(os.environ)
              env.pop('CASS_INDEX_WRITER_BUSY_TIMEOUT_MS', None)
              if value is not None:
                  env['CASS_INDEX_WRITER_BUSY_TIMEOUT_MS'] = value
              result = subprocess.run([str(binary), str(expected)], cwd=root / 'gh473-core', env=env, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=20)
              print(f'policy={value!r}\n{result.stdout}', flush=True)
              assert result.returncode == 0
              assert f'GH473_CORE_OK policy_ms={expected} released_attempts=2 exhausted_attempts=3 permanent_attempts=1' in result.stdout
              assert 'GH473_CORE_READONLY_OK attempts=1' in result.stdout
          print('6/6 exact-source engine cases passed; NOT a full CASS persistence receipt.')
          PY
      - name: Attempt full locked CASS qualification independently
        if: always() && steps.commit.outcome == 'success'
        run: |
          set -euo pipefail
          timeout 1800s cargo test --locked --lib gh473 -- --nocapture
      - name: State qualification boundary
        if: always()
        run: |
          echo 'Exact-source engine checks do not compile full CASS or qualify the canonical ledger or integrated search products.'
          echo 'A blocked full dependency graph remains a failed runtime qualification gate.'
