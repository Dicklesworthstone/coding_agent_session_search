# The one-time patch landed in 90a1bf2d. This workflow is now read-only.
name: Verify GH473 preflight patch is present
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify production source without mutations
        run: python3 scripts/verify_gh473_core.py "$RUNNER_TEMP/gh473-source-check"
